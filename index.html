<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York Store · Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f12;
  --card: #16161a;
  --card2: #1c1c22;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --gold: #f0b429;
  --gold2: #ffd166;
  --cyan: #06d6a0;
  --text: #f0eff4;
  --text2: #8b8a94;
  --text3: #55545c;
  --red: #ef476f;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.header-left { display: flex; align-items: center; gap: 14px; }
.logo-badge { width: 40px; height: 40px; background: var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.brand { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.brand-sub { font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.live-pill { display: flex; align-items: center; gap: 6px; background: rgba(6,214,160,0.1); border: 1px solid rgba(6,214,160,0.2); border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 600; color: var(--cyan); letter-spacing: 0.5px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.btn { background: var(--card); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 14px; color: var(--text2); font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--gold); color: var(--gold); }
.btn-countdown { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); }
.relogio { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); }

/* DATE + NAV */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.date-inputs { display: flex; gap: 8px; }
.date-group { display: flex; flex-direction: column; gap: 4px; }
.date-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
.date-input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 12px; font-family: inherit; width: 140px; transition: border-color 0.2s; }
.date-input:focus { outline: none; border-color: var(--gold); }
.nav { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; background: transparent; color: var(--text2); white-space: nowrap; }
.nav-btn.active { background: var(--gold); color: #0f0f12; }

/* SELETOR DE LOJA */
.loja-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.loja-switch { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.loja-btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; background: transparent; color: var(--text2); white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.loja-btn.active { background: var(--card2); color: var(--gold2); box-shadow: inset 0 0 0 1px rgba(240,180,41,0.3); }
.loja-obs { font-size: 11px; color: var(--text3); }

/* ERROR / LOADING */
.error-box { background: rgba(239,71,111,0.08); border: 1px solid rgba(239,71,111,0.2); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: var(--red); display: none; line-height: 1.5; }
.error-box a { color: var(--cyan); }
.loading { display: none; text-align: center; padding: 80px 20px; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
.loading p { font-size: 14px; color: var(--text2); margin-bottom: 4px; }
.loading span { font-size: 12px; color: var(--text3); }
.tab-loading { text-align: center; padding: 70px 20px; }
.tab-loading .spinner { margin-bottom: 16px; }
.tab-loading p { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.tab-loading span { font-size: 12px; color: var(--text3); }
.empty { color: var(--text3); text-align: center; padding: 60px 20px; font-size: 13px; line-height: 1.6; }

/* KPI CARDS */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 600px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.kpi-num { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--text); }
.kpi-num.gold { color: var(--gold); }
.kpi-num.cyan { color: var(--cyan); }
.kpi-num.red { color: var(--red); }
.kpi-num.sm { font-size: 24px; }
.kpi-meta { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* MAIN GRID */
.main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; margin-bottom: 16px; }
@media (max-width: 760px) { .main-grid { grid-template-columns: 1fr; } }

/* CHARTS */
.charts-col { display: flex; flex-direction: column; gap: 12px; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
.chart-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 14px; }

/* AVATAR DO VENDEDOR */
.avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; position: relative; display: inline-flex; align-items: center; justify-content: center; background: var(--card2); border: 1px solid var(--border2); overflow: hidden; font-size: 15px; line-height: 1; vertical-align: middle; }
.avatar img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.avatar.sm { width: 28px; height: 28px; font-size: 12px; }
.avatar.lg { width: 52px; height: 52px; font-size: 22px; }

/* VENDEDORES */
.vendedores-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.card-header { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 14px; }

.v-item { border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
.v-item:hover { background: var(--card2); }
.v-item.active { background: rgba(240,180,41,0.07); border-color: rgba(240,180,41,0.25); }

.v-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.v-info { display: flex; align-items: center; gap: 10px; }
.v-rank { font-size: 16px; }
.v-name { font-size: 14px; font-weight: 700; color: var(--text); }
.v-item.active .v-name { color: var(--gold2); }
.v-tags { font-size: 11px; color: var(--text3); margin-top: 2px; }
.v-fat { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); text-align: right; }
.v-item.active .v-fat { color: var(--gold2); }
.v-tm { font-size: 10px; color: var(--text3); text-align: right; margin-top: 2px; }
.v-bar { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.v-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.7s ease; }

.v-gerentes { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--card2); border-radius: 8px; margin-top: 8px; font-size: 11px; color: var(--text3); }

/* DETALHE */
.detalhe-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.detalhe-topo { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
.detalhe-nome { font-size: 22px; font-weight: 800; color: var(--gold2); letter-spacing: -0.5px; margin-bottom: 4px; }
.detalhe-rank { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card2); border-radius: 10px; padding: 14px 12px; text-align: center; }
.stat-label { font-size: 9px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.stat-val { font-size: 20px; font-weight: 800; color: var(--cyan); letter-spacing: -0.5px; }
.stat-val.gold { color: var(--gold); }
.stat-val.red { color: var(--red); }

.part-bar-wrap { margin-top: 16px; }
.part-bar-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.part-bar-top span:last-child { color: var(--gold); font-weight: 700; }
.part-bar { height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
.part-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 3px; transition: width 0.8s ease; }

/* RANKING */
.rk-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 10px; transition: border-color 0.2s; }
.rk-item:hover { border-color: var(--border2); }
.rk-item.first { border-color: rgba(240,180,41,0.3); background: rgba(240,180,41,0.04); }
.rk-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.rk-left { display: flex; align-items: center; gap: 12px; }
.rk-medal { font-size: 24px; }
.rk-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.rk-item.first .rk-name { color: var(--gold2); }
.rk-meta { font-size: 11px; color: var(--text3); }
.rk-fat { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: var(--text); }
.rk-item.first .rk-fat { color: var(--gold2); }
.rk-pct { font-size: 11px; color: var(--text3); text-align: right; margin-top: 2px; }
.rk-bar { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.rk-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 1s ease; }
.rk-item:not(.first) .rk-bar-fill { background: var(--text3); }

/* FORM */
.form-note { font-size: 12px; color: var(--text3); background: var(--card); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 16px; line-height: 1.5; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 5px; }
.f-input, .f-select { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: inherit; transition: border-color 0.2s; }
.f-input:focus, .f-select:focus { outline: none; border-color: var(--gold); }
.f-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
.f-section-title { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.check { display: flex; align-items: center; gap: 10px; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.2s; user-select: none; }
.check.on { background: rgba(240,180,41,0.08); border-color: rgba(240,180,41,0.3); }
.check-box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--text3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; font-weight: 800; color: var(--bg); transition: all 0.15s; }
.check.on .check-box { border-color: var(--gold); background: var(--gold); }
.check-lbl { font-size: 11px; font-weight: 500; color: var(--text3); }
.check.on .check-lbl { color: var(--gold2); }
.score-line { text-align: right; font-size: 11px; color: var(--text3); margin-top: 10px; }
.score-line b { color: var(--gold); }
.btn-save { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--bg); font-family: inherit; cursor: pointer; letter-spacing: 0.5px; margin-top: 10px; transition: opacity 0.2s; }
.btn-save:hover { opacity: 0.9; }

/* TOAST */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 500; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.ok { background: rgba(6,214,160,0.15); border: 1px solid rgba(6,214,160,0.35); color: var(--cyan); }
.toast.err { background: rgba(239,71,111,0.15); border: 1px solid rgba(239,71,111,0.35); color: var(--red); }
.footer-line { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%); }

/* METAS */
.meta-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
.meta-vendedor { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.meta-nome { font-size: 15px; font-weight: 700; color: var(--text); }
.meta-atual { font-size: 11px; color: var(--text3); margin-top: 2px; }
.meta-input-row { display: flex; align-items: center; gap: 10px; }
.meta-prefix { font-size: 13px; font-weight: 600; color: var(--text2); }
.meta-input { flex: 1; background: var(--card2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 16px; font-weight: 700; font-family: inherit; transition: border-color 0.2s; }
.meta-input:focus { outline: none; border-color: var(--gold); }
.meta-progress { margin-top: 14px; }
.meta-progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.meta-pct { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
.meta-pct.ok { color: var(--cyan); }
.meta-pct.warn { color: var(--gold); }
.meta-pct.danger { color: var(--red); }
.meta-resto { font-size: 11px; color: var(--text3); }
.meta-bar { height: 8px; background: var(--border2); border-radius: 4px; overflow: hidden; }
.meta-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.meta-bar-fill.ok { background: var(--cyan); }
.meta-bar-fill.warn { background: var(--gold); }
.meta-bar-fill.danger { background: var(--red); }
.btn-save-metas { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--bg); font-family: inherit; cursor: pointer; margin-top: 4px; }
.meta-dia-hint { font-size: 11px; color: var(--text3); margin-top: 10px; line-height: 1.6; background: var(--card2); border-radius: 8px; padding: 10px 12px; }
.meta-dia-hint b { color: var(--gold2); }
/* METAS · seção por loja com os 3 níveis */
.mt-loja { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.mt-loja-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; gap: 10px; flex-wrap: wrap; }
.mt-loja-nome { font-size: 12px; font-weight: 700; color: var(--gold2); letter-spacing: 0.2px; }
.mt-loja-fat { font-size: 11px; color: var(--text3); }
.mt-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 560px) { .mt-inputs { grid-template-columns: 1fr; } }
.mt-campo .f-label { margin-bottom: 4px; }
.mt-input-wrap { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border2); border-radius: 8px; padding: 0 10px; transition: border-color 0.2s; }
.mt-input-wrap:focus-within { border-color: var(--gold); }
.mt-prefix { font-size: 11px; font-weight: 600; color: var(--text3); flex-shrink: 0; }
.mt-input { flex: 1; min-width: 0; background: transparent; border: none; padding: 9px 0; color: var(--text); font-size: 14px; font-weight: 700; font-family: inherit; }
.mt-input:focus { outline: none; }
.mt-status { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.mt-falta { font-size: 11px; color: var(--text3); }
.mt-falta b { color: var(--gold2); }
.mt-vazio { font-size: 11px; color: var(--text3); margin-top: 11px; font-style: italic; }
.mt-aviso { font-size: 10.5px; color: var(--gold2); background: rgba(240,180,41,0.08); border-radius: 7px; padding: 7px 10px; margin-top: 11px; line-height: 1.45; }
.mt-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
@media (max-width: 560px) { .mt-resumo { grid-template-columns: 1fr; } }
.mt-resumo-item { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.mt-resumo-item.batido { border-color: rgba(6,214,160,0.3); background: rgba(6,214,160,0.05); }
.mt-resumo-lbl { font-size: 9.5px; font-weight: 700; color: var(--text3); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 5px; }
.mt-resumo-val { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
.mt-resumo-item.batido .mt-resumo-val { color: var(--cyan); }
.mt-resumo-pct { font-size: 10.5px; color: var(--text3); margin-top: 2px; }


/* META BADGE no card do vendedor */
.meta-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-top: 4px; }
.meta-badge.ok { background: rgba(6,214,160,0.12); color: var(--cyan); }
.meta-badge.warn { background: rgba(240,180,41,0.12); color: var(--gold); }
.meta-badge.danger { background: rgba(239,71,111,0.12); color: var(--red); }
.meta-badge.neutro { background: rgba(255,255,255,0.06); color: var(--text3); }
/* níveis: abaixo / meta / super / ouro */
.meta-badge.abaixo { background: rgba(239,71,111,0.12); color: var(--red); }
.meta-badge.meta   { background: rgba(240,180,41,0.12); color: var(--gold); }
.meta-badge.super  { background: rgba(6,214,160,0.12); color: var(--cyan); }
.meta-badge.ouro   { background: linear-gradient(90deg, rgba(240,180,41,0.22), rgba(255,209,102,0.10)); color: var(--gold2); box-shadow: inset 0 0 0 1px rgba(240,180,41,0.35); }

/* BARRA COM MARCADORES DE NÍVEL */
.nv-bar-wrap { position: relative; height: 8px; background: var(--border2); border-radius: 4px; overflow: hidden; margin-top: 7px; }
.nv-bar-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; transition: width 0.7s ease; background: var(--red); }
.nv-bar-fill.meta  { background: var(--gold); }
.nv-bar-fill.super { background: var(--cyan); }
.nv-bar-fill.ouro  { background: linear-gradient(90deg, var(--gold), var(--gold2)); }
.nv-marca { position: absolute; top: 0; width: 2px; height: 100%; background: var(--bg); opacity: 0.85; }
.nv-marca.batido { background: rgba(255,255,255,0.55); }
.nv-legenda { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 9.5px; color: var(--text3); flex-wrap: wrap; }
.nv-legenda span.batido { color: var(--gold2); font-weight: 700; }

/* ── HOJE ── */
.hoje-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.hoje-data { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.hoje-data span { color: var(--gold); }
.hoje-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
.hoje-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 700px) { .hoje-grid { grid-template-columns: 1fr; } }
.hj-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; gap: 16px; align-items: center; transition: border-color 0.2s; }
.hj-card.ok { border-color: rgba(6,214,160,0.35); }
.hj-card.warn { border-color: rgba(240,180,41,0.35); }

.alertas { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }

/* CALENDÁRIO */
.cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }

.cal-cell { aspect-ratio: 1; border-radius: 8px; background: var(--card2); border: 1px solid var(--border); padding: 5px 4px 4px; display: flex; flex-direction: column; justify-content: space-between; min-height: 46px; cursor: default; transition: transform 0.15s; }
.cal-cell:hover { transform: scale(1.06); z-index: 2; }

/* TABELA */
.tbl-wrap { overflow-x: auto; }

.tbl th { text-align: right; font-size: 9.5px; font-weight: 700; color: var(--text3); letter-spacing: 0.7px; text-transform: uppercase; padding: 0 10px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }

/* SAZONALIDADE */

@media (max-width: 700px) { .saz-grid { grid-template-columns: 1fr; } }

.saz-imp-n.warn { color: var(--gold); }
.saz-imp-n.danger { color: var(--red); }
.saz-imp-n.neutro { color: var(--text3); }
.saz-imp-l { font-size: 11px; color: var(--text3); }

/* SEÇÕES */
.sec-title { font-size: 12px; font-weight: 800; color: var(--text); letter-spacing: 0.3px; margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }

.pill-group { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.pill { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 11px; font-weight: 600; color: var(--text3); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.pill.active { border-color: var(--gold); color: var(--gold); background: rgba(240,180,41,0.07); }

/* MÊS */
.mes-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 10px; }

.mes-pct { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-align: right; line-height: 1; }
.mes-pct.ok { color: var(--cyan); }
.mes-pct.warn { color: var(--gold); }
.mes-pct.danger { color: var(--red); }
.mes-pct-l { font-size: 10px; color: var(--text3); text-align: right; margin-top: 3px; }
.mes-bar-wrap { position: relative; height: 10px; background: var(--border2); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
.mes-bar-real { position: absolute; top: 0; left: 0; height: 100%; border-radius: 5px; }
.mes-bar-real.ok { background: var(--cyan); }
.mes-bar-real.warn { background: var(--gold); }
.mes-bar-real.danger { background: var(--red); }
.mes-bar-proj { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(45deg, rgba(255,255,255,0.13), rgba(255,255,255,0.13) 4px, transparent 4px, transparent 8px); }
.mes-marca { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--text); opacity: 0.55; }
.mes-legend { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); }
.mes-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); gap: 10px; flex-wrap: wrap; }
.mes-foot-txt { font-size: 11.5px; color: var(--text3); line-height: 1.5; }
.mes-foot-txt b { color: var(--gold2); }
.veredito { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; padding: 5px 11px; border-radius: 7px; white-space: nowrap; }
.veredito.ok { background: rgba(6,214,160,0.13); color: var(--cyan); }
.veredito.warn { background: rgba(240,180,41,0.13); color: var(--gold); }
.veredito.danger { background: rgba(239,71,111,0.13); color: var(--red); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.animate { animation: up 0.4s ease both; }
</style>

<div class="toast" id="toast"></div>
<div class="page">

  <div id="tab-metas" style="display:none"></div>
</div>
<div class="footer-line"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
"use strict";
const BACKEND = "https://dashboard-metas.onrender.com";
const COLORS = ["#f0b429","#06d6a0","#ef476f","#4895ef","#a8dadc"];

/* ══ CONFIGURAÇÃO ══════════════════════════════════════════════════ */
const LOJAS = {
  "203654110": { nome: "Parque do Povo", emoji: "🏬", dias: [1,2,3,4,5,6], obs: "Segunda a sábado (fecha domingo)" },
  "203777302": { nome: "Prudenshopping", emoji: "🛍", dias: [0,1,2,3,4,5,6], obs: "Aberta todos os dias" }
};
const IDS_LOJAS = Object.keys(LOJAS);
const VENDEDORES = [
  { nome: "Guilherme", id: "15596666568", emoji: "👨‍💼", foto: "fotos/guilherme.jpg" },
  { nome: "Felipe",    id: "15596595092", emoji: "👨",   foto: "fotos/felipe.jpg" },
  { nome: "Giovana",   id: "15596218776", emoji: "👩",   foto: "fotos/giovana.jpg" }
];
const NOMES_V = VENDEDORES.map(function(v){ return v.nome; });
const EMOJI_V = {}; VENDEDORES.forEach(function(v){ EMOJI_V[v.nome] = v.emoji; });
const FOTO_V = {};  VENDEDORES.forEach(function(v){ FOTO_V[v.nome] = v.foto; });

// Avatar circular com foto. Se a imagem não carregar, o <img> se remove e
// sobra o emoji que está por baixo — nada de quadrado quebrado no card.
function avatar(nome, tamanho){
  var cls = "avatar" + (tamanho ? " " + tamanho : "");
  var emoji = EMOJI_V[nome] || "👤";
  var foto = FOTO_V[nome];
  var h = '<span class="'+cls+'" aria-hidden="true">'+emoji;
  if(foto) h += '<img src="'+foto+'" alt="" loading="lazy" onerror="this.remove()">';
  return h + '</span>';
}

const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_C = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// Horário de loja usado para medir o quanto do dia já passou
const HORA_ABRE = 9, HORA_FECHA = 22;

const ABAS = [
  { id: "dashboard",    rotulo: "📊 Dashboard" },
  { id: "hoje",         rotulo: "📅 Hoje" },
  { id: "semana",       rotulo: "📊 Semana" },
  { id: "mes",          rotulo: "📈 Mês" },
  { id: "sazonalidade", rotulo: "🗓 Sazonalidade" },
  { id: "lancar",       rotulo: "＋ Lançar" },
  { id: "ranking",      rotulo: "🏆 Ranking" },
  { id: "metas",        rotulo: "🎯 Metas" }
];

/* ══ ESTADO ════════════════════════════════════════════════════════ */
let dados = null;      // período dos seletores de data (Dashboard / Ranking)
let dadosHoje = null;  // apenas o dia de hoje
let dadosMes = null;   // mês corrente completo
let hist = null;       // /historico
let histErro = null;
let carregandoHist = false;
let mesesHist = 6;
let selVendedor = null, ops = [], abaAtual = "dashboard", lojaSel = "todas";
const checks = {};

/* ══ HELPERS DE DATA (sempre em hora local, nunca UTC) ═════════════ */
function pad2(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function hojeStr(){ return ymd(new Date()); }
function dt(s){ return new Date(s+"T12:00:00"); }
function dow(s){ return dt(s).getDay(); }
function addD(d,n){ return new Date(d.getTime()+n*86400000); }
function diasNoMes(a,m){ return new Date(a,m+1,0).getDate(); }
function fmtDM(s){ var d=dt(s); return pad2(d.getDate())+"/"+pad2(d.getMonth()+1); }
function fmtLongo(s){ var d=dt(s); return DIAS[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()]; }
function primeiroDiaMes(){ var d=new Date(); return ymd(new Date(d.getFullYear(), d.getMonth(), 1)); }

const hoje = hojeStr();
document.getElementById("dataInicio").value = primeiroDiaMes();
document.getElementById("dataFim").value = hoje;

function R(n,d){ d=d||0; return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function Rk(n){ n=Number(n||0); return n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+"k" : R(n); }

function toast(msg,tipo){
  var t=document.getElementById("toast");
  t.textContent=msg; t.className="toast "+(tipo||"ok")+" show";
  setTimeout(function(){ t.className="toast"; },3000);
}

/* ══ CHARTS ════════════════════════════════════════════════════════ */
const charts = {};
function mkChart(id,cfg){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
  var el=document.getElementById(id);
  if(!el || typeof Chart==="undefined") return;
  charts[id]=new Chart(el,cfg);
}
function killCharts(){ Object.keys(charts).forEach(function(k){ charts[k].destroy(); delete charts[k]; }); }
const CO_BASE = {
  responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{display:false} },
  scales:{
    x:{ ticks:{color:"#55545c",font:{size:11}}, grid:{color:"rgba(255,255,255,0.04)"} },
    y:{ ticks:{color:"#55545c",font:{size:10}}, grid:{color:"rgba(255,255,255,0.05)"} }
  }
};
function eixoReais(){ return { ticks:{color:"#55545c",font:{size:10},callback:function(v){return "R$"+Rk(v);}}, grid:{color:"rgba(255,255,255,0.05)"} }; }

/* ══ METAS ══════════════════════════════════════════════════════════
   3 níveis por vendedor por loja, em localStorage:
   { "Giovana": { "203654110": { meta, superMeta, ouro }, ... }, ... }
   A meta-base ("meta") é a que alimenta a distribuição diária e as
   projeções; superMeta e ouro são degraus de reconhecimento por cima. */
const LS_METAS = "nys_metas_v3";
const NIVEIS = [
  { chave: "meta",      rotulo: "Meta",       curto: "Meta",  emoji: "🟡", cor: "var(--gold)" },
  { chave: "superMeta", rotulo: "Super Meta", curto: "Super", emoji: "🟢", cor: "var(--cyan)" },
  { chave: "ouro",      rotulo: "Meta Ouro",  curto: "Ouro",  emoji: "🏆", cor: "var(--gold2)" }
];
let metas = {};
let legadoMigrado = false;

function metasVazias(){
  var o = {};
  IDS_LOJAS.forEach(function(id){ o[id] = { meta: 0, superMeta: 0, ouro: 0 }; });
  return o;
}
function normalizarNiveis(bruto){
  var o = { meta: 0, superMeta: 0, ouro: 0 };
  if(bruto == null) return o;
  if(typeof bruto === "number") { o.meta = bruto; return o; }   // formato antigo: só um número
  NIVEIS.forEach(function(n){ o[n.chave] = Number(bruto[n.chave]) || 0; });
  return o;
}

(function carregarMetas(){
  NOMES_V.forEach(function(nome){ metas[nome] = metasVazias(); });
  try {
    var v3 = JSON.parse(localStorage.getItem(LS_METAS) || "null");
    if(v3){
      NOMES_V.forEach(function(nome){
        IDS_LOJAS.forEach(function(id){
          metas[nome][id] = normalizarNiveis((v3[nome] || {})[id]);
        });
      });
      return;
    }
    // v2: { lojaId: { vendedor: valor } } → vira a meta-base de cada loja
    var v2 = JSON.parse(localStorage.getItem("nys_metas_v2") || "null");
    if(v2){
      var achou = false;
      IDS_LOJAS.forEach(function(id){
        Object.keys(v2[id] || {}).forEach(function(nome){
          if(!metas[nome]) return;                       // vendedor que saiu do time
          var val = Number(v2[id][nome]) || 0;
          if(val > 0){ metas[nome][id].meta = val; achou = true; }
        });
      });
      if(achou) legadoMigrado = true;
      return;
    }
    // metas_fat: { vendedor: valor }, sem loja → cai na primeira loja
    var v1 = JSON.parse(localStorage.getItem("metas_fat") || "null");
    if(v1){
      var achou1 = false;
      Object.keys(v1).forEach(function(nome){
        if(!metas[nome]) return;
        var val = Number(v1[nome]) || 0;
        if(val > 0){ metas[nome][IDS_LOJAS[0]].meta = val; achou1 = true; }
      });
      if(achou1) legadoMigrado = true;
    }
  } catch(e){}
})();

function persistirMetas(){
  try { localStorage.setItem(LS_METAS, JSON.stringify(metas)); } catch(e){ toast("Não foi possível salvar no navegador","err"); }
}

// Valor de um nível. Com "todas", soma as duas lojas naquele mesmo nível.
function metaNivel(nome, lojaId, nivel){
  if(lojaId==="todas") return IDS_LOJAS.reduce(function(s,id){ return s+metaNivel(nome,id,nivel); },0);
  var reg = (metas[nome]||{})[lojaId];
  return reg ? (Number(reg[nivel]) || 0) : 0;
}
// Meta-base: é ela que a distribuição diária e as projeções usam.
function metaV(nome, lojaId){ return metaNivel(nome, lojaId, "meta"); }
function metaLoja(lojaId){
  return NOMES_V.reduce(function(s,n){ return s+metaV(n,lojaId); },0);
}

// Nível efetivamente alcançado. Avalia do mais alto para o mais baixo e
// ignora níveis não preenchidos, então funciona mesmo com valores fora de ordem.
function nivelAtingido(nome, lojaId, fat){
  var definidos = NIVEIS.map(function(n){ return { nivel: n, valor: metaNivel(nome,lojaId,n.chave) }; })
                        .filter(function(x){ return x.valor > 0; });
  if(!definidos.length) return null;
  var ordenados = definidos.slice().sort(function(a,b){ return b.valor-a.valor; });
  for(var i=0;i<ordenados.length;i++){
    if(fat >= ordenados[i].valor) return ordenados[i].nivel.chave;
  }
  return "abaixo";
}
function rotuloNivel(chave){
  if(chave==="ouro")      return "🏆 Meta Ouro atingida";
  if(chave==="superMeta") return "🟢 Super Meta atingida";
  if(chave==="meta")      return "🟡 Meta atingida";
  return "🔴 Abaixo da Meta";
}
function classeNivel(chave){
  if(chave==="ouro")      return "ouro";
  if(chave==="superMeta") return "super";
  if(chave==="meta")      return "meta";
  return "abaixo";
}
// Níveis preenchidos, em ordem crescente — base da barra de progresso.
function niveisDefinidos(nome, lojaId){
  return NIVEIS.map(function(n){ return { chave: n.chave, rotulo: n.rotulo, curto: n.curto, emoji: n.emoji, valor: metaNivel(nome,lojaId,n.chave) }; })
               .filter(function(x){ return x.valor > 0; })
               .sort(function(a,b){ return a.valor-b.valor; });
}
// true quando os níveis preenchidos não estão em ordem crescente
function niveisForaDeOrdem(nome, lojaId){
  var vals = NIVEIS.map(function(n){ return metaNivel(nome,lojaId,n.chave); });
  var ant = 0;
  for(var i=0;i<vals.length;i++){
    if(vals[i] <= 0) continue;
    if(vals[i] <= ant) return true;
    ant = vals[i];
  }
  return false;
}

// Barra com marcadores nos pontos de meta / super / ouro
function barraNiveisHTML(nome, lojaId, fat){
  var defs = niveisDefinidos(nome, lojaId);
  if(!defs.length) return "";
  var teto = defs[defs.length-1].valor;
  var atingido = nivelAtingido(nome, lojaId, fat);
  var largura = Math.min(100, teto>0 ? fat/teto*100 : 0);
  var h = '<div class="nv-bar-wrap" title="R$ '+R(fat)+' de R$ '+R(teto)+' (teto: '+defs[defs.length-1].rotulo+')">';
  h += '<div class="nv-bar-fill '+classeNivel(atingido)+'" style="width:'+largura.toFixed(1)+'%"></div>';
  defs.forEach(function(d){
    var pos = teto>0 ? Math.min(100, d.valor/teto*100) : 0;
    var ok = fat >= d.valor;
    h += '<div class="nv-marca'+(ok?" batido":"")+'" style="left:'+pos.toFixed(1)+'%" title="'+d.rotulo+': R$ '+R(d.valor)+'"></div>';

  h += '</div>';
  h += '<div class="nv-legenda">';

    h += '<span class="'+(fat>=d.valor?"batido":"")+'">'+d.emoji+' '+d.curto+' R$ '+Rk(d.valor)+'</span>';

function pascoa(ano){
  var a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
  return new Date(ano,mes-1,dia,12);
}
function nDiaSemana(ano,mes,ds,n){
  var d=new Date(ano,mes-1,1,12);
  var desloc=(ds-d.getDay()+7)%7;
  return new Date(ano,mes-1,1+desloc+(n-1)*7,12);
}
function ultimoDiaSemana(ano,mes,ds){
  var ultimo=new Date(ano,mes,0,12);
  var desloc=(ultimo.getDay()-ds+7)%7;
  return new Date(ano,mes-1,ultimo.getDate()-desloc,12);
}
function fx(a,m,d){ return new Date(a,m-1,d,12); }

const cacheEventos = {};
function eventosDoAno(ano){
  if(cacheEventos[ano]) return cacheEventos[ano];
  cacheEventos[ano] = EVENTOS.map(function(ev){
    var d = ev.quando(ano);
    return {
      nome: ev.nome, emoji: ev.emoji, ano: ano, data: ymd(d),
      janelaInicio: ymd(addD(d,-ev.antes)),
      janelaFim: ymd(addD(d,ev.depois)),
      diasJanela: ev.antes+ev.depois+1
    };
  });
  return cacheEventos[ano];
}

/* ══ MOTOR DE DISTRIBUIÇÃO (o "inteligente" das metas) ═════════════ */
function fonteHist(lojaId){
  if(!hist) return null;
  if(lojaId!=="todas" && hist.lojas && hist.lojas[lojaId]) return hist.lojas[lojaId];
  return hist.geral || null;
}

// Peso "dia normal" de cada dia da semana, aprendido do Bling.
// Usa a média por dia SEM janelas sazonais para não contar duas vezes.
function pesosDS(lojaId){
  var src = fonteHist(lojaId);
  var abertos = diasAbertos(lojaId);
  var out = [0,0,0,0,0,0,0], soma = 0;
  if(src && src.diaSemana){
    for(var d=0; d<7; d++){
      if(abertos.indexOf(d)===-1) continue;
      var b = src.diaSemana[d] || {};
      var p = b.baseMediaDia || b.mediaDia || 0;
      out[d] = p; soma += p;
    }
  }
  if(soma<=0){
    abertos.forEach(function(d){ out[d]=1; });
    return { pesos: out, aprendido: false };
  }
  return { pesos: out, aprendido: true };
}

// Multiplicador aprendido de uma data comemorativa (média dos anos medidos)
function multAprendido(nomeEvento, lojaId){
  var src = fonteHist(lojaId);
  if(!src || !src.sazonalidade) return null;
  var medidos = src.sazonalidade.filter(function(e){ return e.nome===nomeEvento && e.comHistorico && e.multiplicador; });
  if(!medidos.length) return null;
  return medidos.reduce(function(s,e){ return s+e.multiplicador; },0) / medidos.length;
}

const cacheDist = {};
function invalidarDist(){ Object.keys(cacheDist).forEach(function(k){ delete cacheDist[k]; }); }

// Fração do faturamento do mês que cada dia deveria representar
function distMes(lojaId, ano, mes){
  var key = lojaId+"_"+ano+"_"+mes;
  if(cacheDist[key]) return cacheDist[key];
  var p = pesosDS(lojaId);
  var evs = eventosDoAno(ano);
  var n = diasNoMes(ano,mes), porDia = {}, total = 0, eventoDe = {};
  for(var dia=1; dia<=n; dia++){
    var s = ano+"-"+pad2(mes+1)+"-"+pad2(dia);
    var w = p.pesos[dow(s)];
    if(w<=0){ porDia[s]=0; continue; }
    var mult = 1;
    for(var i=0;i<evs.length;i++){
      var ev = evs[i];
      if(s>=ev.janelaInicio && s<=ev.janelaFim){
        if(!eventoDe[s]) eventoDe[s] = ev;
        var m = multAprendido(ev.nome, lojaId);
        if(m && m>1) mult = Math.max(mult, m);
      }
    }
    porDia[s] = w*mult; total += w*mult;
  }
  Object.keys(porDia).forEach(function(k){ porDia[k] = total>0 ? porDia[k]/total : 0; });
  cacheDist[key] = { porDia: porDia, aprendido: p.aprendido, eventoDe: eventoDe };
  return cacheDist[key];
}

// Quanto do dia de hoje já passou (0..1), pelo horário de loja
function fracHoje(){
  var ag = new Date();
  var h = ag.getHours() + ag.getMinutes()/60;
  if(h <= HORA_ABRE) return 0.02;
  if(h >= HORA_FECHA) return 1;
  return (h-HORA_ABRE)/(HORA_FECHA-HORA_ABRE);
}

// Meta do dia de um vendedor (recursiva para "todas")
function metaDiaV(nome, lojaId, dataStr){
  if(lojaId==="todas") return IDS_LOJAS.reduce(function(s,id){ return s+metaDiaV(nome,id,dataStr); },0);
  var d = dt(dataStr);
  var dist = distMes(lojaId, d.getFullYear(), d.getMonth());
  return metaV(nome,lojaId) * (dist.porDia[dataStr]||0);
}
function metaDiaLoja(lojaId, dataStr){
  if(lojaId==="todas") return IDS_LOJAS.reduce(function(s,id){ return s+metaDiaLoja(id,dataStr); },0);
  var d = dt(dataStr);
  var dist = distMes(lojaId, d.getFullYear(), d.getMonth());
  return metaLoja(lojaId) * (dist.porDia[dataStr]||0);
}
// Fração do mês acumulada até uma data (fracParcial aplica ao último dia)
function fracAcum(lojaId, ateStr, fracParcial){
  var d = dt(ateStr);
  var dist = distMes(lojaId, d.getFullYear(), d.getMonth());
  var s = 0;
  Object.keys(dist.porDia).forEach(function(k){
    if(k < ateStr) s += dist.porDia[k];
    else if(k === ateStr) s += dist.porDia[k] * (fracParcial==null ? 1 : fracParcial);
  });
  return s;
}
// Fração restante a partir de uma data (inclusive)
function fracRestante(lojaId, deStr){
  var d = dt(deStr);
  var dist = distMes(lojaId, d.getFullYear(), d.getMonth());
  var s = 0;
  Object.keys(dist.porDia).forEach(function(k){ if(k >= deStr) s += dist.porDia[k]; });
  return s;
}
function metaAcumV(nome, lojaId, ateStr, fracParcial){
  if(lojaId==="todas") return IDS_LOJAS.reduce(function(s,id){ return s+metaAcumV(nome,id,ateStr,fracParcial); },0);
  return metaV(nome,lojaId) * fracAcum(lojaId, ateStr, fracParcial);
}

/* ══ LEITURA DOS DADOS DO BACKEND ══════════════════════════════════ */
function temPorLoja(d){ return !!(d && d.porLoja); }

// Faturamento de um vendedor num conjunto de dados, para a loja selecionada
function fatV(d, nome, lojaId){
  if(!d) return 0;
  if(lojaId==="todas"){
    if(temPorLoja(d)) return IDS_LOJAS.reduce(function(s,id){ return s+fatV(d,nome,id); },0);
    var g = (d.vendedores||[]).find(function(v){ return v.nome===nome; });
    return g ? g.faturamento : 0;
  }
  if(!temPorLoja(d) || !d.porLoja[lojaId]) return 0;
  var v = (d.porLoja[lojaId].vendedores||[]).find(function(x){ return x.nome===nome; });
  return v ? v.faturamento : 0;
}
function pedV(d, nome, lojaId){
  if(!d) return 0;
  if(lojaId==="todas"){
    if(temPorLoja(d)) return IDS_LOJAS.reduce(function(s,id){ return s+pedV(d,nome,id); },0);
    var g = (d.vendedores||[]).find(function(v){ return v.nome===nome; });
    return g ? g.pedidos : 0;
  }
  if(!temPorLoja(d) || !d.porLoja[lojaId]) return 0;
  var v = (d.porLoja[lojaId].vendedores||[]).find(function(x){ return x.nome===nome; });
  return v ? v.pedidos : 0;
}
// Vendedores da loja selecionada, ordenados (exclui Gerentes)
function vendedoresDe(d, lojaId){
  if(!d) return [];
  var lista;
  if(lojaId==="todas" || !temPorLoja(d)){
    if(temPorLoja(d)){
      var mapa = {};
      IDS_LOJAS.forEach(function(id){
        ((d.porLoja[id]||{}).vendedores||[]).forEach(function(v){
          if(!mapa[v.nome]) mapa[v.nome] = { nome:v.nome, faturamento:0, pedidos:0, pecas:0 };
          mapa[v.nome].faturamento += v.faturamento;
          mapa[v.nome].pedidos += v.pedidos;
          mapa[v.nome].pecas += v.pecas;
        });
      });
      lista = Object.keys(mapa).map(function(k){
        var m = mapa[k];
        m.ticketMedio = m.pedidos>0 ? m.faturamento/m.pedidos : 0;
        return m;
      });
    } else {
      lista = (d.vendedores||[]).slice();
    }
  } else {
    lista = (((d.porLoja||{})[lojaId]||{}).vendedores||[]).slice();
  }
  return lista.filter(function(v){ return v.nome!=="Gerentes"; })
              .sort(function(a,b){ return b.faturamento-a.faturamento; });
}
function gerentesDe(d, lojaId){
  if(!d) return null;
  if(lojaId==="todas" || !temPorLoja(d)){
    if(!temPorLoja(d)) return (d.vendedores||[]).find(function(v){ return v.nome==="Gerentes"; }) || null;
    var fat=0, ped=0, achou=false;
    IDS_LOJAS.forEach(function(id){
      var g = (((d.porLoja[id]||{}).vendedores)||[]).find(function(v){ return v.nome==="Gerentes"; });
      if(g){ achou=true; fat+=g.faturamento; ped+=g.pedidos; }
    });
    return achou ? { nome:"Gerentes", faturamento:fat, pedidos:ped } : null;
  }
  return ((((d.porLoja||{})[lojaId]||{}).vendedores)||[]).find(function(v){ return v.nome==="Gerentes"; }) || null;
}
// Série diária realizada da loja selecionada: { "2026-08-01": faturamento }
function serieRealizada(lojaId){
  var out = {};
  function juntar(fonte){
    if(!fonte) return;
    Object.keys(fonte).forEach(function(data){
      var reg = fonte[data];
      var val;
      if(lojaId==="todas") val = reg.faturamento;
      else val = reg.porLoja && reg.porLoja[lojaId] ? reg.porLoja[lojaId].faturamento : 0;
      out[data] = val;
    });
  }
  // histórico (base) → mês corrente (mais fresco) → hoje (ao vivo)
  if(hist){
    var src = fonteHist(lojaId);
    if(src && src.diario){
      src.diario.forEach(function(r){ out[r.data] = r.faturamento; });
    }
  }
  if(dadosMes && dadosMes.diario) juntar(dadosMes.diario);
  if(dados && dados.diario) juntar(dados.diario);
  if(dadosHoje && dadosHoje.diario) juntar(dadosHoje.diario);
  return out;
}

/* ══ FETCH ═════════════════════════════════════════════════════════ */
async function pegarVendas(di, df){
  var r = await fetch(BACKEND+"/vendas?dataInicio="+di+"&dataFim="+df);
  var j = await r.json();
  if(j.erro) throw new Error(j.erro);
  return j;
}

async function buscarDados(){
  var di = document.getElementById("dataInicio").value;
  var df = document.getElementById("dataFim").value;
  document.getElementById("loading").style.display = "block";
  document.getElementById("error-box").style.display = "none";
  document.getElementById("tab-dashboard").innerHTML = "";
  killCharts();
  try {
    var j = await pegarVendas(di, df);
    dados = j;
    var vends = vendedoresDe(dados, lojaSel);
    selVendedor = vends[0] ? vends[0].nome : null;
    // Se o período é o mês corrente, reaproveita como dadosMes
    if(di===primeiroDiaMes() && df===hoje) dadosMes = j;
    render(abaAtual);
  } catch(e){
    var eb = document.getElementById("error-box");
    eb.style.display = "block";
    eb.innerHTML = (e.message.indexOf("utenticado")>-1 || e.message.indexOf("fetch")>-1)
      ? '⚠️ Backend desconectado. <a href="'+BACKEND+'/auth" target="_blank">Clique aqui para reconectar</a> e depois atualize.'
      : "⚠️ "+e.message;
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

let carregandoHoje = false;
async function garantirHoje(forcar){
  if(carregandoHoje) return;
  if(dadosHoje && !forcar) return;
  carregandoHoje = true;
  try {
    dadosHoje = await pegarVendas(hoje, hoje);
    if(abaAtual==="hoje") buildHoje();
  } catch(e){
    if(abaAtual==="hoje" && !dadosHoje){
      document.getElementById("tab-hoje").innerHTML = erroBackendHTML("Não foi possível carregar as vendas de hoje: "+e.message);
    }
  } finally { carregandoHoje = false; }
}

let carregandoMes = false;
async function garantirMes(forcar){
  if(carregandoMes) return;
  if(dadosMes && !forcar) return;
  carregandoMes = true;
  try {
    dadosMes = await pegarVendas(primeiroDiaMes(), hoje);
    if(abaAtual==="mes") buildMes();
    if(abaAtual==="hoje") buildHoje();
  } catch(e){
  } finally { carregandoMes = false; }
}

async function garantirHist(forcar){
  if(carregandoHist) return;
  if(hist && !forcar) return;
  carregandoHist = true;
  histErro = null;
  try {
    var r = await fetch(BACKEND+"/historico?meses="+mesesHist);
    var j = await r.json();
    if(j.erro) throw new Error(j.erro);
    hist = j;
    invalidarDist();
  } catch(e){
    histErro = e.message;
  } finally {
    carregandoHist = false;
    render(abaAtual);
  }
}

async function atualizarTudo(){
  dadosHoje = null; dadosMes = null;
  await buscarDados();
  garantirHoje(true);
  if(["semana","mes","sazonalidade","metas"].indexOf(abaAtual)>-1) garantirHist(true);
}

/* ══ ABA: DASHBOARD ════════════════════════════════════════════════ */
function buildDashboard(){
  if(!dados){ document.getElementById("tab-dashboard").innerHTML = ""; return; }

  var ger = gerentesDe(dados, lojaSel);

  var tmGeral = pedTotal>0 ? fatTotal/pedTotal : 0;
  var paGeral = pedTotal>0 ? pecasTotal/pedTotal : 0;
  var labels = vends.map(function(v){ return v.nome; });
  var cores = vends.map(function(_,i){ return COLORS[i]||"#888"; });

  }

  h += '<div class="kpi"><div class="kpi-label">💰 Faturamento</div><div class="kpi-num gold">R$ '+R(fatTotal)+'</div><div class="kpi-meta">'+nomeLoja(lojaSel)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🛍 Pedidos</div><div class="kpi-num">'+R(pedTotal)+'</div><div class="kpi-meta">'+(lojaSel==="todas"?R(dados.totalPedidos)+" no total (com gerentes)":"da loja")+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">👗 Peças</div><div class="kpi-num cyan">'+R(pecasTotal)+'</div><div class="kpi-meta">itens vendidos</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🎯 Ticket Médio</div><div class="kpi-num">R$ '+R(tmGeral)+'</div><div class="kpi-meta">PA '+paGeral.toFixed(1)+' peças/ped</div></div>';
  h += '</div>';

  h += '<div class="main-grid animate">';
  h += '<div class="charts-col">';
  h += '<div class="chart-card"><div class="chart-title">Faturamento por Vendedor (R$)</div><div style="position:relative;height:180px"><canvas id="cFat" role="img" aria-label="Faturamento por vendedor"></canvas></div></div>';
  h += '<div class="chart-card"><div class="chart-title">Pedidos &amp; Peças por Vendedor</div><div style="position:relative;height:180px"><canvas id="cPed" role="img" aria-label="Pedidos e peças por vendedor"></canvas></div></div>';
  h += '</div>';

  h += '<div>';
  h += '<div class="vendedores-card">';
  h += '<div class="card-header">Vendedores · '+nomeLoja(lojaSel)+'</div>';
  vends.forEach(function(v,i){
    var pct = fatTotal>0 ? v.faturamento/fatTotal*100 : 0;
    var pa = v.pedidos>0 ? (v.pecas/v.pedidos).toFixed(1) : "—";
    var meta = metaV(v.nome, lojaSel);
    var defs = niveisDefinidos(v.nome, lojaSel);
    var atingido = nivelAtingido(v.nome, lojaSel, v.faturamento);
    var metaPct = meta>0 ? Math.min(100,(v.faturamento/meta*100)).toFixed(0) : null;
    h += '<div class="v-item '+(selVendedor===v.nome?"active":"")+'" onclick="selV(\''+v.nome+'\')">';
    h += '<div class="v-top">';
    h += '<div class="v-info"><div class="v-rank">'+medals[i]+'</div>'+avatar(v.nome,"sm")+'<div><div class="v-name">'+v.nome+'</div><div class="v-tags">'+v.pedidos+' ped · PA '+pa+'</div>';
    if(atingido) h += '<div class="meta-badge '+classeNivel(atingido)+'">'+rotuloNivel(atingido)+(metaPct?' · '+metaPct+'%':'')+'</div>';

    h += '<div><div class="v-fat">R$'+R(v.faturamento)+'</div><div class="v-tm">TM R$'+R(v.ticketMedio)+'</div></div>';

    if(defs.length) h += barraNiveisHTML(v.nome, lojaSel, v.faturamento);
    h += '<div class="v-bar" style="margin-top:7px"><div class="v-bar-fill" style="width:'+pct.toFixed(1)+'%"></div></div>';
