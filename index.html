<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York Store · Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0e;
  --surface: #141416;
  --surface2: #1a1a1d;
  --border: rgba(255,255,255,0.06);
  --border-light: rgba(255,255,255,0.12);
  --gold: #c9a96e;
  --gold-light: #e8cc9a;
  --cyan: #4dd9c0;
  --text: #e8e6e0;
  --muted: #6b6860;
  --muted2: #9a9690;
  --danger: #e05a5a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.ambient { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
.ambient-1 { width: 600px; height: 600px; background: rgba(201,169,110,0.06); top: -200px; right: -200px; }
.ambient-2 { width: 500px; height: 500px; background: rgba(77,217,192,0.04); bottom: -100px; left: -100px; }
.wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes spin { to { transform: rotate(360deg); } }
.fade-1 { animation: fadeUp 0.5s ease 0.05s both; }
.fade-2 { animation: fadeUp 0.5s ease 0.15s both; }
.fade-3 { animation: fadeUp 0.5s ease 0.25s both; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; animation: fadeUp 0.5s ease both; }
.brand-eyebrow { font-size: 9px; font-weight: 500; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
.brand-name { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--text); letter-spacing: -1px; line-height: 1; }
.brand-name span { font-weight: 600; color: var(--gold-light); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(77,217,192,0.1); border: 1px solid rgba(77,217,192,0.25); border-radius: 20px; padding: 6px 14px; font-size: 10px; font-weight: 500; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: pulse 2s infinite; }
.btn-refresh { background: none; border: 1px solid var(--border-light); border-radius: 8px; padding: 8px 16px; color: var(--muted2); font-size: 11px; font-family: inherit; cursor: pointer; transition: all 0.2s; }
.btn-refresh:hover { border-color: var(--gold); color: var(--gold); }

/* CONTROLS */
.controls { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
.date-field label { display: block; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.date-field input { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px; font-family: inherit; transition: border-color 0.2s; }
.date-field input:focus { outline: none; border-color: var(--gold); }

/* NAV */
.nav { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
.nav-btn { flex: 1; padding: 10px; border: none; border-radius: 9px; font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.25s; background: transparent; color: var(--muted); }
.nav-btn.active { background: linear-gradient(135deg, var(--gold), #a87c42); color: #0c0c0e; font-weight: 600; box-shadow: 0 4px 20px rgba(201,169,110,0.3); }

/* ERROR / LOADING */
.error-box { background: rgba(224,90,90,0.08); border: 1px solid rgba(224,90,90,0.25); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: var(--danger); display: none; }
.error-box a { color: var(--cyan); }
.loading { display: none; text-align: center; padding: 60px 20px; }
.loading-spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
.loading-text { font-size: 13px; color: var(--muted2); margin-bottom: 4px; }
.loading-sub { font-size: 11px; color: var(--muted); }

/* KPI STRIP */
.kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
@media (max-width: 600px) { .kpi-strip { grid-template-columns: repeat(2, 1fr); } }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 16px; transition: border-color 0.2s; }
.kpi-card:hover { border-color: var(--border-light); }
.kpi-label { font-size: 9px; font-weight: 500; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.kpi-value { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -1px; line-height: 1; }
.kpi-accent { color: var(--gold-light); }
.kpi-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }

/* GRID LAYOUT */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
@media (max-width: 680px) { .grid-3 { grid-template-columns: 1fr; } }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.card-title { font-size: 9px; font-weight: 500; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }
.section-title { font-size: 9px; font-weight: 500; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }

/* VENDEDOR ROW */
.vendedor-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
.vendedor-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: background 0.25s; }
.vendedor-card:hover { border-color: var(--border-light); }
.vendedor-card.active { border-color: rgba(201,169,110,0.3); background: rgba(201,169,110,0.04); }
.vendedor-card.active::before { background: var(--gold); }
.vc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.vc-left { display: flex; align-items: center; gap: 10px; }
.vc-medal { font-size: 18px; }
.vc-nome { font-size: 14px; font-weight: 500; color: var(--text); }
.vendedor-card.active .vc-nome { color: var(--gold-light); }
.vc-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.vc-fat { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--text); text-align: right; }
.vendedor-card.active .vc-fat { color: var(--gold-light); }
.vc-tm { font-size: 10px; color: var(--muted); text-align: right; margin-top: 2px; }
.vc-bar { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
.vc-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; transition: width 0.8s ease; }

/* DETALHE */
.detalhe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ds { background: var(--surface2); border-radius: 10px; padding: 12px 10px; text-align: center; }
.ds-label { font-size: 8px; font-weight: 500; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.ds-val { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--cyan); letter-spacing: -0.5px; }

/* RANKING */
.rk-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 10px; }
.rk-card.top1 { border-color: rgba(201,169,110,0.3); }
.rk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.rk-left { display: flex; align-items: center; gap: 12px; }
.rk-medal { font-size: 22px; }
.rk-nome { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.rk-card.top1 .rk-nome { color: var(--gold-light); }
.rk-sub { font-size: 11px; color: var(--muted); }
.rk-fat { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: var(--text); }
.rk-card.top1 .rk-fat { color: var(--gold-light); }
.rk-pct { font-size: 10px; color: var(--muted); }
.rk-bar { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
.rk-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; transition: width 1s ease; }
.rk-card:not(.top1) .rk-bar-fill { background: linear-gradient(90deg, #3a3a40, #555); }
.gerentes-row { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }

/* FORM */
.form-info { font-size: 11px; color: var(--muted); margin-bottom: 16px; padding: 12px 14px; background: var(--surface2); border-radius: 10px; border-left: 3px solid var(--gold); line-height: 1.5; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.form-group { margin-bottom: 10px; }
.form-label { display: block; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.form-select, .form-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; color: var(--text); font-size: 13px; font-family: inherit; transition: border-color 0.2s; }
.form-select:focus, .form-input:focus { outline: none; border-color: var(--gold); }
.form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
.form-section-title { font-size: 9px; font-weight: 500; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; }
.check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-item { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; cursor: pointer; transition: all 0.2s; user-select: none; }
.check-item.checked { background: rgba(201,169,110,0.08); border-color: rgba(201,169,110,0.3); }
.check-box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 10px; font-weight: 700; color: var(--bg); }
.check-item.checked .check-box { border-color: var(--gold); background: var(--gold); }
.check-label { font-size: 11px; color: var(--muted2); }
.check-item.checked .check-label { color: var(--gold-light); }
.score-count { text-align: right; font-size: 11px; color: var(--muted); margin-top: 10px; }
.score-count span { color: var(--gold); font-weight: 600; }
.btn-salvar { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #a87c42); border: none; border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--bg); font-family: inherit; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; margin-top: 12px; }

/* TOAST */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 999; border-radius: 12px; padding: 12px 22px; font-size: 13px; white-space: nowrap; opacity: 0; pointer-events: none; transition: all 0.3s; }
.toast.show { opacity: 1; }
.toast.ok { background: rgba(77,217,192,0.15); border: 1px solid rgba(77,217,192,0.4); color: var(--cyan); }
.toast.erro { background: rgba(224,90,90,0.15); border: 1px solid rgba(224,90,90,0.4); color: var(--danger); }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); z-index: 10; }
</style>
</head>
<body>
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>
<div class="toast" id="toast"></div>
<div class="wrap">

  <div class="header">
    <div>
      <div class="brand-eyebrow">Performance Dashboard</div>
      <div class="brand-name">New York <span>Store</span></div>
    </div>
    <div class="header-actions">
      <div class="live-badge"><div class="live-dot"></div>Bling Live</div>
      <button class="btn-refresh" onclick="buscarDados()">↻ Atualizar</button>
    </div>
  </div>

  <div class="controls fade-1">
    <div class="date-field"><label>De</label><input type="date" id="dataInicio"></div>
    <div class="date-field"><label>Até</label><input type="date" id="dataFim"></div>
  </div>

  <div class="nav fade-2">
    <button class="nav-btn active" onclick="mudarAba('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" onclick="mudarAba('lancar')">＋ Lançar</button>
    <button class="nav-btn" onclick="mudarAba('ranking')">🏆 Ranking</button>
  </div>

  <div id="erro-box" class="error-box"></div>
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Buscando dados do Bling</div>
    <div class="loading-sub">Pode levar até 2 minutos</div>
  </div>

  <div id="aba-dashboard" class="fade-3"></div>
  <div id="aba-lancar" style="display:none"></div>
  <div id="aba-ranking" style="display:none"></div>
</div>
<div class="bottom-bar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const BACKEND = "https://dashboard-metas.onrender.com";
let dados = null;
let vendedorSel = null;
let operacional = [];
let abaAtual = "dashboard";
const checkState = {};
const CORES_CHART = ["#c9a96e","#4dd9c0","#e87d7d","#7d9ee8","#9ee87d"];

const hoje = new Date().toISOString().slice(0,10);
const inicioMes = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
document.getElementById("dataInicio").value = inicioMes;
document.getElementById("dataFim").value = hoje;

function fmt(val, dec) { dec = dec !== undefined ? dec : 0; return Number(val).toLocaleString("pt-BR", {minimumFractionDigits:dec, maximumFractionDigits:dec}); }

function showToast(msg, tipo) {
  tipo = tipo || "ok";
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast " + tipo + " show";
  setTimeout(function(){ t.className = "toast"; }, 3500);
}

function mudarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll(".nav-btn").forEach(function(b,i){
    b.classList.toggle("active", ["dashboard","lancar","ranking"][i] === aba);
  });
  ["dashboard","lancar","ranking"].forEach(function(id){
    document.getElementById("aba-"+id).style.display = id===aba ? "block" : "none";
  });
  if (aba === "lancar") renderLancar();
  if (aba === "ranking") renderRanking();
}

var chartFat = null, chartConv = null, chartTM = null;

function destroyCharts() {
  if (chartFat) { chartFat.destroy(); chartFat = null; }
  if (chartConv) { chartConv.destroy(); chartConv = null; }
  if (chartTM) { chartTM.destroy(); chartTM = null; }
}

async function buscarDados() {
  var inicio = document.getElementById("dataInicio").value;
  var fim = document.getElementById("dataFim").value;
  document.getElementById("loading").style.display = "block";
  document.getElementById("erro-box").style.display = "none";
  document.getElementById("aba-dashboard").innerHTML = "";
  destroyCharts();
  try {
    var res = await fetch(BACKEND + "/vendas?dataInicio="+inicio+"&dataFim="+fim);
    var json = await res.json();
    if (json.erro) throw new Error(json.erro);
    dados = Object.assign({}, json, {
      vendedores: (json.vendedores||[]).slice().sort(function(a,b){ return b.faturamento-a.faturamento; })
    });
    vendedorSel = dados.vendedores.filter(function(v){ return v.nome!=="Gerentes"; })[0]
      ? dados.vendedores.filter(function(v){ return v.nome!=="Gerentes"; })[0].nome : null;
    renderDashboard();
    if (abaAtual==="ranking") renderRanking();
  } catch(e) {
    var box = document.getElementById("erro-box");
    box.style.display = "block";
    box.innerHTML = e.message.includes("autenticado")||e.message.includes("fetch")
      ? '⚠️ Backend desconectado. <a href="'+BACKEND+'/auth" target="_blank">Clique aqui para reconectar</a> e atualize.'
      : "⚠️ " + e.message;
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

function renderDashboard() {
  if (!dados) return;
  destroyCharts();
  var vendedores = dados.vendedores.filter(function(v){ return v.nome!=="Gerentes"; });
  var gerentes = dados.vendedores.find(function(v){ return v.nome==="Gerentes"; });
  var totalFat = vendedores.reduce(function(s,v){ return s+v.faturamento; },0);
  var totalPedidos = vendedores.reduce(function(s,v){ return s+v.pedidos; },0);
  var totalPecas = vendedores.reduce(function(s,v){ return s+v.pecas; },0);
  var tmGeral = totalPedidos > 0 ? totalFat/totalPedidos : 0;
  var medals = ["🥇","🥈","🥉","🏅","🏅"];
  var labels = vendedores.map(function(v){ return v.nome; });
  var cores = vendedores.map(function(_,i){ return CORES_CHART[i] || "#888"; });

  var html = "";

  // KPIs
  html += '<div class="kpi-strip">';
  html += '<div class="kpi-card"><div class="kpi-label">Faturamento Total</div><div class="kpi-value kpi-accent">R$ '+fmt(totalFat)+'</div><div class="kpi-sub">vendedores ativos</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Total Pedidos</div><div class="kpi-value">'+fmt(dados.totalPedidos)+'</div><div class="kpi-sub">incluindo gerentes</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Total Peças</div><div class="kpi-value">'+fmt(totalPecas)+'</div><div class="kpi-sub">itens vendidos</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Ticket Médio</div><div class="kpi-value">R$ '+fmt(tmGeral)+'</div><div class="kpi-sub">geral vendedores</div></div>';
  html += '</div>';

  // Charts row
  html += '<div class="grid-3">';
  html += '<div class="card"><div class="card-title">Faturamento (R$)</div><div style="position:relative;height:200px"><canvas id="chartFat" role="img" aria-label="Faturamento por vendedor"></canvas></div></div>';
  html += '<div class="card"><div class="card-title">Pedidos</div><div style="position:relative;height:200px"><canvas id="chartPed" role="img" aria-label="Pedidos por vendedor"></canvas></div></div>';
  html += '<div class="card"><div class="card-title">Ticket Médio (R$)</div><div style="position:relative;height:200px"><canvas id="chartTM" role="img" aria-label="Ticket médio por vendedor"></canvas></div></div>';
  html += '</div>';

  // Vendedores + detalhe
  html += '<div class="grid-2">';
  html += '<div>';
  html += '<div class="section-title">Vendedores</div>';
  vendedores.forEach(function(v,i){
    var pct = totalFat>0 ? v.faturamento/totalFat*100 : 0;
    html += '<div class="vendedor-card '+(vendedorSel===v.nome?'active':'')+'" onclick="selecionarVendedor(\''+v.nome+'\''+')">';
    html += '<div class="vc-row"><div class="vc-left"><div class="vc-medal">'+medals[i]+'</div><div><div class="vc-nome">'+v.nome+'</div><div class="vc-sub">'+v.pedidos+' ped · '+v.pecas+' peças · PA '+(v.pedidos>0?(v.pecas/v.pedidos).toFixed(1):"—")+'</div></div></div>';
    html += '<div><div class="vc-fat">R$ '+fmt(v.faturamento)+'</div><div class="vc-tm">TM R$ '+fmt(v.ticketMedio)+'</div></div></div>';
    html += '<div class="vc-bar"><div class="vc-bar-fill" style="width:'+pct.toFixed(1)+'%"></div></div>';
    html += '</div>';
  });
  if (gerentes) {
    html += '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:4px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">';
    html += '<span>👔 Gerentes</span><span>R$ '+fmt(gerentes.faturamento)+' · '+gerentes.pedidos+' ped</span></div>';
  }
  html += '</div>';

  // Detalhe vendedor
  var v = dados.vendedores.find(function(x){ return x.nome===vendedorSel; });
  if (v) {
    var op = operacional.filter(function(r){ return r.vendedor===v.nome; });
    var scoreMedio = op.length>0 ? (op.reduce(function(s,r){ return s+["vmLoja","araras","vitrine","passadoria","cadastro","posVenda"].filter(function(k){ return r[k]; }).length; },0)/op.length).toFixed(1) : "—";
    var atLoja = op.reduce(function(s,r){ return s+(Number(r.atendLoja)||0); },0);
    var conv = atLoja>0 ? Math.round(v.pedidos/atLoja*100)+"%" : "—";
    var partPct = totalFat>0 ? (v.faturamento/totalFat*100).toFixed(1) : 0;
    html += '<div>';
    html += '<div class="section-title">'+v.nome+' — Detalhe</div>';
    html += '<div class="card">';
    html += '<div class="detalhe-grid" style="margin-bottom:16px">';
    var pa = v.pedidos > 0 ? (v.pecas/v.pedidos).toFixed(1) : "—";
    [["Faturamento","R$ "+fmt(v.faturamento)],["Ticket Médio","R$ "+fmt(v.ticketMedio)],["Peças",fmt(v.pecas)],
     ["Pedidos",fmt(v.pedidos)],["PA (peças/ped)",pa],["Score Op.",scoreMedio!=="—"?scoreMedio+"/6":"—"]
    ].forEach(function(s){
      html += '<div class="ds"><div class="ds-label">'+s[0]+'</div><div class="ds-val">'+s[1]+'</div></div>';
    });
    html += '</div>';
    html += '<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px"><span>Participação no faturamento</span><span style="color:var(--gold)">'+partPct+'%</span></div>';
    html += '<div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+partPct+'%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px;transition:width 0.8s ease"></div></div></div>';
    html += '</div>';
    html += '</div>';
  }

  html += '</div>';
  document.getElementById("aba-dashboard").innerHTML = html;

  // Render charts
  var cfg = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ color:"#6b6860", font:{ size:11 } }, grid:{ color:"rgba(255,255,255,0.04)" } }, y:{ ticks:{ color:"#6b6860", font:{ size:10 } }, grid:{ color:"rgba(255,255,255,0.04)" } } } };

  chartFat = new Chart(document.getElementById("chartFat"), {
    type:"bar",
    data:{ labels:labels, datasets:[{ data:vendedores.map(function(v){ return Math.round(v.faturamento); }), backgroundColor:cores, borderRadius:6, borderSkipped:false }] },
    options: Object.assign({}, cfg, { scales:{ x:Object.assign({},cfg.scales.x), y:{ ticks:{ color:"#6b6860", font:{size:10}, callback:function(v){ return "R$"+fmt(v); } }, grid:{ color:"rgba(255,255,255,0.04)" } } } })
  });

  chartConv = new Chart(document.getElementById("chartPed"), {
    type:"bar",
    data:{ labels:labels, datasets:[{ data:vendedores.map(function(v){ return v.pedidos; }), backgroundColor:cores, borderRadius:6, borderSkipped:false }] },
    options: cfg
  });

  chartTM = new Chart(document.getElementById("chartTM"), {
    type:"bar",
    data:{ labels:labels, datasets:[{ data:vendedores.map(function(v){ return Math.round(v.ticketMedio); }), backgroundColor:cores, borderRadius:6, borderSkipped:false }] },
    options: Object.assign({}, cfg, { scales:{ x:Object.assign({},cfg.scales.x), y:{ ticks:{ color:"#6b6860", font:{size:10}, callback:function(v){ return "R$"+fmt(v); } }, grid:{ color:"rgba(255,255,255,0.04)" } } } })
  });
}

function selecionarVendedor(nome) { vendedorSel=nome; renderDashboard(); }

function renderRanking() {
  if (!dados) { document.getElementById("aba-ranking").innerHTML='<div style="color:var(--muted);text-align:center;padding:60px">Carregue os dados primeiro</div>'; return; }
  var vendedores = dados.vendedores.filter(function(v){ return v.nome!=="Gerentes"; });
  var gerentes = dados.vendedores.find(function(v){ return v.nome==="Gerentes"; });
  var totalFat = vendedores.reduce(function(s,v){ return s+v.faturamento; },0);
  var medals = ["🥇","🥈","🥉","🏅","🏅"];
  var html = '<div class="section-title">Ranking por Faturamento</div>';
  vendedores.forEach(function(v,i){
    var pct = totalFat>0 ? (v.faturamento/totalFat*100).toFixed(1) : 0;
    html += '<div class="rk-card '+(i===0?'top1':'')+'">';
    html += '<div class="rk-header">';
    html += '<div class="rk-left"><div class="rk-medal">'+medals[i]+'</div><div><div class="rk-nome">'+v.nome+'</div><div class="rk-sub">'+v.pedidos+' pedidos · '+v.pecas+' peças · PA '+(v.pedidos>0?(v.pecas/v.pedidos).toFixed(1):"—")+' · TM R$ '+fmt(v.ticketMedio)+'</div></div></div>';
    html += '<div style="text-align:right"><div class="rk-fat">R$ '+fmt(v.faturamento)+'</div><div class="rk-pct">'+pct+'% do total</div></div>';
    html += '</div>';
    html += '<div class="rk-bar"><div class="rk-bar-fill" style="width:'+pct+'%"></div></div>';
    html += '</div>';
  });
  if (gerentes) {
    html += '<div class="gerentes-row"><span>👔 Gerentes (Rafael + Lucas)</span><span>R$ '+fmt(gerentes.faturamento)+' · '+gerentes.pedidos+' ped</span></div>';
  }
  document.getElementById("aba-ranking").innerHTML = html;
}

function renderLancar() {
  var vnomes = dados&&dados.vendedores ? dados.vendedores.filter(function(v){ return v.nome!=="Gerentes"; }).map(function(v){ return v.nome; }) : ["Felipe","Giovana","Guilherme"];
  var checks = [["vmLoja","VM Loja"],["araras","Araras"],["vitrine","Vitrine"],["passadoria","Passadoria"],["cadastro","Cadastro Produto"],["posVenda","Pós-venda"]];
  var html = '<div class="form-info">💡 Faturamento e pedidos vêm do Bling automaticamente. Aqui você registra só os dados operacionais do dia.</div>';
  html += '<div class="form-row">';
  html += '<div class="form-group"><label class="form-label">Vendedor *</label><select id="f-vendedor" class="form-select"><option value="">Selecionar...</option>'+vnomes.map(function(v){ return '<option>'+v+'</option>'; }).join("")+'</select></div>';
  html += '<div class="form-group"><label class="form-label">Data *</label><input type="date" id="f-data" class="form-input" value="'+hoje+'"></div>';
  html += '</div>';
  html += '<div class="form-section"><div class="form-section-title">Atendimentos</div><div class="form-row">';
  html += '<div><label class="form-label">Atend. Loja</label><input type="number" id="f-atendLoja" class="form-input" placeholder="0" min="0"></div>';
  html += '<div><label class="form-label">Atend. WhatsApp</label><input type="number" id="f-atendWhats" class="form-input" placeholder="0" min="0"></div>';
  html += '</div></div>';
  html += '<div class="form-section"><div class="form-section-title">Score Operacional</div><div class="check-grid">';
  checks.forEach(function(c){
    html += '<div class="check-item '+(checkState[c[0]]?'checked':'')+'" id="ci-'+c[0]+'" onclick="toggleCheck(\''+c[0]+'\')"><div class="check-box" id="cb-'+c[0]+'">'+(checkState[c[0]]?'✓':'')+'</div><span class="check-label">'+c[1]+'</span></div>';
  });
  html += '</div><div class="score-count">Score: <span id="score-count">'+Object.values(checkState).filter(Boolean).length+' / 6</span></div></div>';
  html += '<button class="btn-salvar" onclick="salvarLancamento()">Salvar Lançamento</button>';
  document.getElementById("aba-lancar").innerHTML = html;
}

function toggleCheck(key) {
  checkState[key] = !checkState[key];
  var item = document.getElementById("ci-"+key);
  var box = document.getElementById("cb-"+key);
  if (item) item.className = "check-item "+(checkState[key]?"checked":"");
  if (box) box.textContent = checkState[key]?"✓":"";
  var sc = document.getElementById("score-count");
  if (sc) sc.textContent = Object.values(checkState).filter(Boolean).length+" / 6";
}

function salvarLancamento() {
  var vendedor = document.getElementById("f-vendedor").value;
  var data = document.getElementById("f-data").value;
  if (!vendedor||!data) { showToast("Preencha vendedor e data!","erro"); return; }
  var reg = { vendedor:vendedor, data:data, atendLoja:document.getElementById("f-atendLoja").value, atendWhats:document.getElementById("f-atendWhats").value };
  Object.keys(checkState).forEach(function(k){ reg[k]=checkState[k]; });
  operacional.push(reg);
  Object.keys(checkState).forEach(function(k){ checkState[k]=false; });
  showToast("✓ Lançamento de "+vendedor+" salvo!");
  mudarAba("dashboard");
  renderDashboard();
}

buscarDados();
</script>
</body>
</html>
