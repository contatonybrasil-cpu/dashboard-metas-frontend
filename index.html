<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York Store · Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f12;
  --card: #16161a;
  --card2: #1c1c22;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --gold: #f0b429;
  --gold2: #ffd166;
  --cyan: #06d6a0;
  --text: #f0eff4;
  --text2: #8b8a94;
  --text3: #55545c;
  --red: #ef476f;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.page { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.header-left { display: flex; align-items: center; gap: 14px; }
.logo-badge { width: 40px; height: 40px; background: var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.brand { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.brand-sub { font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.live-pill { display: flex; align-items: center; gap: 6px; background: rgba(6,214,160,0.1); border: 1px solid rgba(6,214,160,0.2); border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 600; color: var(--cyan); letter-spacing: 0.5px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: blink 2s infinite; }
.btn { background: var(--card); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 14px; color: var(--text2); font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--gold); color: var(--gold); }
.btn-countdown { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text3); }

/* DATE + NAV */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.date-inputs { display: flex; gap: 8px; }
.date-group { display: flex; flex-direction: column; gap: 4px; }
.date-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
.date-input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 12px; font-family: inherit; width: 140px; transition: border-color 0.2s; }
.date-input:focus { outline: none; border-color: var(--gold); }
.nav { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.nav-btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; background: transparent; color: var(--text2); white-space: nowrap; }
.nav-btn.active { background: var(--gold); color: #0f0f12; }

/* ERROR / LOADING */
.error-box { background: rgba(239,71,111,0.08); border: 1px solid rgba(239,71,111,0.2); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: var(--red); display: none; line-height: 1.5; }
.error-box a { color: var(--cyan); }
.loading { display: none; text-align: center; padding: 80px 20px; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
.loading p { font-size: 14px; color: var(--text2); margin-bottom: 4px; }
.loading span { font-size: 12px; color: var(--text3); }

/* KPI CARDS */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 600px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.kpi-num { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--text); }
.kpi-num.gold { color: var(--gold); }
.kpi-num.cyan { color: var(--cyan); }
.kpi-meta { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* MAIN GRID */
.main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; margin-bottom: 16px; }
@media (max-width: 760px) { .main-grid { grid-template-columns: 1fr; } }

/* CHARTS */
.charts-col { display: flex; flex-direction: column; gap: 12px; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.chart-title { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 14px; }

/* VENDEDORES */
.vendedores-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.card-header { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 14px; }

.v-item { border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
.v-item:hover { background: var(--card2); }
.v-item.active { background: rgba(240,180,41,0.07); border-color: rgba(240,180,41,0.25); }

.v-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.v-info { display: flex; align-items: center; gap: 10px; }
.v-rank { font-size: 16px; }
.v-name { font-size: 14px; font-weight: 700; color: var(--text); }
.v-item.active .v-name { color: var(--gold2); }
.v-tags { font-size: 11px; color: var(--text3); margin-top: 2px; }
.v-fat { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); text-align: right; }
.v-item.active .v-fat { color: var(--gold2); }
.v-tm { font-size: 10px; color: var(--text3); text-align: right; margin-top: 2px; }
.v-bar { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.v-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.7s ease; }

.v-gerentes { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--card2); border-radius: 8px; margin-top: 8px; font-size: 11px; color: var(--text3); }

/* DETALHE */
.detalhe-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.detalhe-nome { font-size: 22px; font-weight: 800; color: var(--gold2); letter-spacing: -0.5px; margin-bottom: 4px; }
.detalhe-rank { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card2); border-radius: 10px; padding: 14px 12px; text-align: center; }
.stat-label { font-size: 9px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.stat-val { font-size: 20px; font-weight: 800; color: var(--cyan); letter-spacing: -0.5px; }
.stat-val.gold { color: var(--gold); }

.part-bar-wrap { margin-top: 16px; }
.part-bar-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.part-bar-top span:last-child { color: var(--gold); font-weight: 700; }
.part-bar { height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
.part-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 3px; transition: width 0.8s ease; }

/* RANKING */
.rk-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 10px; transition: border-color 0.2s; }
.rk-item:hover { border-color: var(--border2); }
.rk-item.first { border-color: rgba(240,180,41,0.3); background: rgba(240,180,41,0.04); }
.rk-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.rk-left { display: flex; align-items: center; gap: 12px; }
.rk-medal { font-size: 24px; }
.rk-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.rk-item.first .rk-name { color: var(--gold2); }
.rk-meta { font-size: 11px; color: var(--text3); }
.rk-fat { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: var(--text); }
.rk-item.first .rk-fat { color: var(--gold2); }
.rk-pct { font-size: 11px; color: var(--text3); text-align: right; margin-top: 2px; }
.rk-bar { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.rk-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 1s ease; }
.rk-item:not(.first) .rk-bar-fill { background: var(--text3); }

/* FORM */
.form-note { font-size: 12px; color: var(--text3); background: var(--card); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 16px; line-height: 1.5; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.f-label { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 5px; }
.f-input, .f-select { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: inherit; transition: border-color 0.2s; }
.f-input:focus, .f-select:focus { outline: none; border-color: var(--gold); }
.f-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
.f-section-title { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.check { display: flex; align-items: center; gap: 10px; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.2s; user-select: none; }
.check.on { background: rgba(240,180,41,0.08); border-color: rgba(240,180,41,0.3); }
.check-box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--text3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; font-weight: 800; color: var(--bg); transition: all 0.15s; }
.check.on .check-box { border-color: var(--gold); background: var(--gold); }
.check-lbl { font-size: 11px; font-weight: 500; color: var(--text3); }
.check.on .check-lbl { color: var(--gold2); }
.score-line { text-align: right; font-size: 11px; color: var(--text3); margin-top: 10px; }
.score-line b { color: var(--gold); }
.btn-save { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--bg); font-family: inherit; cursor: pointer; letter-spacing: 0.5px; margin-top: 10px; transition: opacity 0.2s; }
.btn-save:hover { opacity: 0.9; }

/* TOAST */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 500; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.ok { background: rgba(6,214,160,0.15); border: 1px solid rgba(6,214,160,0.35); color: var(--cyan); }
.toast.err { background: rgba(239,71,111,0.15); border: 1px solid rgba(239,71,111,0.35); color: var(--red); }
.footer-line { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%); }

/* METAS */
.meta-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 12px; }
.meta-vendedor { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.meta-avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.meta-nome { font-size: 15px; font-weight: 700; color: var(--text); }
.meta-atual { font-size: 11px; color: var(--text3); margin-top: 2px; }
.meta-input-row { display: flex; align-items: center; gap: 10px; }
.meta-prefix { font-size: 13px; font-weight: 600; color: var(--text2); }
.meta-input { flex: 1; background: var(--card2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 16px; font-weight: 700; font-family: inherit; transition: border-color 0.2s; }
.meta-input:focus { outline: none; border-color: var(--gold); }
.meta-progress { margin-top: 14px; }
.meta-progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.meta-pct { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
.meta-pct.ok { color: var(--cyan); }
.meta-pct.warn { color: var(--gold); }
.meta-pct.danger { color: var(--red); }
.meta-resto { font-size: 11px; color: var(--text3); }
.meta-bar { height: 8px; background: var(--border2); border-radius: 4px; overflow: hidden; }
.meta-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.meta-bar-fill.ok { background: var(--cyan); }
.meta-bar-fill.warn { background: var(--gold); }
.meta-bar-fill.danger { background: var(--red); }
.btn-save-metas { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--bg); font-family: inherit; cursor: pointer; margin-top: 4px; }

/* META BADGE no card do vendedor */
.meta-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-top: 4px; }
.meta-badge.ok { background: rgba(6,214,160,0.12); color: var(--cyan); }
.meta-badge.warn { background: rgba(240,180,41,0.12); color: var(--gold); }
.meta-badge.danger { background: rgba(239,71,111,0.12); color: var(--red); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.animate { animation: up 0.4s ease both; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="page">

  <div class="header animate">
    <div class="header-left">
      <div class="logo-badge">🏪</div>
      <div>
        <div class="brand">New York Store</div>
        <div class="brand-sub">Dashboard de Performance</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-pill"><div class="live-dot"></div>Bling Live</div>
      <button class="btn" onclick="buscarDados()">↻ Atualizar <span class="btn-countdown" id="countdown"></span></button>
    </div>
  </div>

  <div class="topbar animate">
    <div class="date-inputs">
      <div class="date-group"><label class="date-label">De</label><input type="date" id="dataInicio" class="date-input"></div>
      <div class="date-group"><label class="date-label">Até</label><input type="date" id="dataFim" class="date-input"></div>
    </div>
    <div class="nav">
      <button class="nav-btn active" onclick="tab('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" onclick="tab('lancar')">＋ Lançar</button>
      <button class="nav-btn" onclick="tab('ranking')">🏆 Ranking</button>
      <button class="nav-btn" onclick="tab('metas')">🎯 Metas</button>
    </div>
  </div>

  <div id="error-box" class="error-box"></div>
  <div id="loading" class="loading"><div class="spinner"></div><p>Buscando dados do Bling...</p><span>Pode levar até 2 minutos</span></div>

  <div id="tab-dashboard"></div>
  <div id="tab-lancar" style="display:none"></div>
  <div id="tab-ranking" style="display:none"></div>
  <div id="tab-metas" style="display:none"></div>
</div>
<div class="footer-line"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const BACKEND = "https://dashboard-metas.onrender.com";
const COLORS = ["#f0b429","#06d6a0","#ef476f","#4895ef","#a8dadc"];
let dados = null, selVendedor = null, ops = [], abaAtual = "dashboard";
const checks = {};

const hoje = new Date().toISOString().slice(0,10);
const mesInicio = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
document.getElementById("dataInicio").value = mesInicio;
document.getElementById("dataFim").value = hoje;

function R(n, d) { d = d||0; return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }

function toast(msg, tipo) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast "+(tipo||"ok")+" show";
  setTimeout(function(){ t.className = "toast"; }, 3000);
}

let chartFat=null, chartPed=null, chartTM=null;
function killCharts() {
  if(chartFat){chartFat.destroy();chartFat=null;}
  if(chartPed){chartPed.destroy();chartPed=null;}
  if(chartTM){chartTM.destroy();chartTM=null;}
}

// Metas salvas em localStorage
var metas = {};
try { metas = JSON.parse(localStorage.getItem("metas_fat") || "{}"); } catch(e) {}

function getMeta(nome) { return metas[nome] || 0; }

function metaStatus(fat, meta) {
  if(!meta || meta === 0) return null;
  var pct = fat/meta*100;
  if(pct >= 100) return "ok";
  if(pct >= 70) return "warn";
  return "danger";
}

function metaEmoji(status) {
  if(status === "ok") return "✓ Meta atingida";
  if(status === "warn") return "⚡ Em evolução";
  return "⚠ Abaixo da meta";
}

function tab(id) {
  abaAtual = id;
  document.querySelectorAll(".nav-btn").forEach(function(b,i){ b.classList.toggle("active",["dashboard","lancar","ranking","metas"][i]===id); });
  ["dashboard","lancar","ranking","metas"].forEach(function(x){ document.getElementById("tab-"+x).style.display=x===id?"block":"none"; });
  if(id==="lancar") buildLancar();
  if(id==="ranking") buildRanking();
  if(id==="metas") buildMetas();
}

async function buscarDados() {
  var di = document.getElementById("dataInicio").value;
  var df = document.getElementById("dataFim").value;
  document.getElementById("loading").style.display = "block";
  document.getElementById("error-box").style.display = "none";
  document.getElementById("tab-dashboard").innerHTML = "";
  killCharts();
  try {
    var r = await fetch(BACKEND+"/vendas?dataInicio="+di+"&dataFim="+df);
    var j = await r.json();
    if(j.erro) throw new Error(j.erro);
    dados = Object.assign({},j,{vendedores:(j.vendedores||[]).slice().sort(function(a,b){return b.faturamento-a.faturamento;})});
    var vends = dados.vendedores.filter(function(v){return v.nome!=="Gerentes";});
    selVendedor = vends[0]?vends[0].nome:null;
    buildDashboard();
    if(abaAtual==="ranking") buildRanking();
  } catch(e) {
    var eb = document.getElementById("error-box");
    eb.style.display = "block";
    eb.innerHTML = e.message.includes("utenticado")||e.message.includes("fetch")
      ? '⚠️ Backend desconectado. <a href="'+BACKEND+'/auth" target="_blank">Clique aqui para reconectar</a> e depois atualize.'
      : "⚠️ "+e.message;
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

function buildDashboard() {
  if(!dados) return;
  killCharts();
  var vends = dados.vendedores.filter(function(v){return v.nome!=="Gerentes";});
  var ger = dados.vendedores.find(function(v){return v.nome==="Gerentes";});
  var fatTotal = vends.reduce(function(s,v){return s+v.faturamento;},0);
  var pedTotal = vends.reduce(function(s,v){return s+v.pedidos;},0);
  var pecasTotal = vends.reduce(function(s,v){return s+v.pecas;},0);
  var tmGeral = pedTotal>0?fatTotal/pedTotal:0;
  var paGeral = pedTotal>0?pecasTotal/pedTotal:0;
  var labels = vends.map(function(v){return v.nome;});
  var cores = vends.map(function(_,i){return COLORS[i]||"#888";});
  var medals = ["🥇","🥈","🥉","🏅","🏅"];

  var h = "";

  // KPIs
  h += '<div class="kpi-row animate">';
  h += '<div class="kpi"><div class="kpi-label">💰 Faturamento</div><div class="kpi-num gold">R$ '+R(fatTotal)+'</div><div class="kpi-meta">vendedores ativos</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🛍 Pedidos</div><div class="kpi-num">'+R(dados.totalPedidos)+'</div><div class="kpi-meta">total do período</div></div>';
  h += '<div class="kpi"><div class="kpi-label">👗 Peças</div><div class="kpi-num cyan">'+R(pecasTotal)+'</div><div class="kpi-meta">itens vendidos</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🎯 Ticket Médio</div><div class="kpi-num">R$ '+R(tmGeral)+'</div><div class="kpi-meta">PA '+paGeral.toFixed(1)+' peças/ped</div></div>';
  h += '</div>';

  // Main grid
  h += '<div class="main-grid animate">';

  // Charts
  h += '<div class="charts-col">';
  h += '<div class="chart-card"><div class="chart-title">Faturamento por Vendedor (R$)</div><div style="position:relative;height:180px"><canvas id="cFat" role="img" aria-label="Faturamento por vendedor"></canvas></div></div>';
  h += '<div class="chart-card"><div class="chart-title">Pedidos &amp; Peças por Vendedor</div><div style="position:relative;height:180px"><canvas id="cPed" role="img" aria-label="Pedidos e peças por vendedor"></canvas></div></div>';
  h += '</div>';

  // Vendedores sidebar
  h += '<div>';
  h += '<div class="vendedores-card">';
  h += '<div class="card-header">Vendedores</div>';
  vends.forEach(function(v,i){
    var pct = fatTotal>0?v.faturamento/fatTotal*100:0;
    var pa = v.pedidos>0?(v.pecas/v.pedidos).toFixed(1):"—";
    var meta = getMeta(v.nome);
    var status = metaStatus(v.faturamento, meta);
    var metaPct = meta>0?Math.min(100,(v.faturamento/meta*100)).toFixed(0):null;
    h += '<div class="v-item '+(selVendedor===v.nome?"active":"")+'" onclick="selV(\''+v.nome+'\')">';
    h += '<div class="v-top">';
    h += '<div class="v-info"><div class="v-rank">'+medals[i]+'</div><div><div class="v-name">'+v.nome+'</div><div class="v-tags">'+v.pedidos+' ped · PA '+pa+'</div>';
    if(status) h += '<div class="meta-badge '+status+'">'+metaEmoji(status)+' · '+metaPct+'%</div>';
    h += '</div></div>';
    h += '<div><div class="v-fat">R$'+R(v.faturamento)+'</div><div class="v-tm">TM R$'+R(v.ticketMedio)+'</div></div>';
    h += '</div>';
    if(meta>0) {
      var barPct = Math.min(100,(v.faturamento/meta*100)).toFixed(1);
      h += '<div class="meta-bar" style="margin-bottom:6px"><div class="meta-bar-fill '+status+'" style="width:'+barPct+'%"></div></div>';
    }
    h += '<div class="v-bar"><div class="v-bar-fill" style="width:'+pct.toFixed(1)+'%"></div></div>';
    h += '</div>';
  });
  if(ger){
    h += '<div class="v-gerentes"><span>👔 Gerentes</span><span>R$ '+R(ger.faturamento)+' · '+ger.pedidos+' ped</span></div>';
  }
  h += '</div>';

  // Detalhe
  var vd = dados.vendedores.find(function(x){return x.nome===selVendedor;});
  if(vd){
    var pa = vd.pedidos>0?(vd.pecas/vd.pedidos).toFixed(1):"—";
    var op = ops.filter(function(r){return r.vendedor===vd.nome;});
    var score = op.length>0?(op.reduce(function(s,r){return s+["vmLoja","araras","vitrine","passadoria","cadastro","posVenda"].filter(function(k){return r[k];}).length;},0)/op.length).toFixed(1):"—";
    var pct = fatTotal>0?(vd.faturamento/fatTotal*100).toFixed(1):0;
    h += '<div class="detalhe-card" style="margin-top:12px">';
    h += '<div class="detalhe-nome">'+vd.nome+'</div>';
    h += '<div class="detalhe-rank">'+vds_rank(vd.nome,vends)+' no ranking · '+pct+'% do faturamento</div>';
    h += '<div class="stats-grid">';
    [
      ["Faturamento","R$ "+R(vd.faturamento),"gold"],
      ["Ticket Médio","R$ "+R(vd.ticketMedio),""],
      ["Peças",R(vd.pecas),""],
      ["Pedidos",R(vd.pedidos),""],
      ["PA",pa,"gold"],
      ["Score Op.",score!=="—"?score+"/6":"—",""],
    ].forEach(function(s){
      h += '<div class="stat"><div class="stat-label">'+s[0]+'</div><div class="stat-val '+(s[2]||'')+'">'+s[1]+'</div></div>';
    });
    h += '</div>';
    h += '<div class="part-bar-wrap"><div class="part-bar-top"><span>Participação</span><span>'+pct+'%</span></div><div class="part-bar"><div class="part-bar-fill" style="width:'+pct+'%"></div></div></div>';
    h += '</div>';
  }
  h += '</div>';
  h += '</div>';

  document.getElementById("tab-dashboard").innerHTML = h;

  // Charts
  var co = {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#55545c",font:{size:11}},grid:{color:"rgba(255,255,255,0.04)"}},y:{ticks:{color:"#55545c",font:{size:10}},grid:{color:"rgba(255,255,255,0.05)"}}}};

  chartFat = new Chart(document.getElementById("cFat"),{
    type:"bar",
    data:{labels:labels,datasets:[{data:vends.map(function(v){return Math.round(v.faturamento);}),backgroundColor:cores,borderRadius:6,borderSkipped:false}]},
    options:Object.assign({},co,{scales:{x:co.scales.x,y:{ticks:{color:"#55545c",font:{size:10},callback:function(v){return "R$"+R(v);}},grid:{color:"rgba(255,255,255,0.05)"}}}})
  });

  chartPed = new Chart(document.getElementById("cPed"),{
    type:"bar",
    data:{labels:labels,datasets:[
      {label:"Pedidos",data:vends.map(function(v){return v.pedidos;}),backgroundColor:cores,borderRadius:4,borderSkipped:false},
      {label:"Peças",data:vends.map(function(v){return v.pecas;}),backgroundColor:cores.map(function(c){return c+"55";}),borderRadius:4,borderSkipped:false}
    ]},
    options:Object.assign({},co,{plugins:{legend:{display:true,labels:{color:"#8b8a94",font:{size:11},boxWidth:10,boxHeight:10}}}})
  });
}

function vds_rank(nome, vends) {
  var i = vends.findIndex(function(v){return v.nome===nome;});
  return i===0?"1º":i===1?"2º":i===2?"3º":(i+1)+"º";
}

function selV(nome) { selVendedor=nome; buildDashboard(); }

function buildRanking() {
  if(!dados){ document.getElementById("tab-ranking").innerHTML='<div style="color:var(--text3);text-align:center;padding:60px">Carregue os dados primeiro</div>'; return; }
  var vends = dados.vendedores.filter(function(v){return v.nome!=="Gerentes";});
  var ger = dados.vendedores.find(function(v){return v.nome==="Gerentes";});
  var fatTotal = vends.reduce(function(s,v){return s+v.faturamento;},0);
  var medals = ["🥇","🥈","🥉","🏅","🏅"];
  var h = "";
  vends.forEach(function(v,i){
    var pct = fatTotal>0?(v.faturamento/fatTotal*100).toFixed(1):0;
    var pa = v.pedidos>0?(v.pecas/v.pedidos).toFixed(1):"—";
    h += '<div class="rk-item '+(i===0?"first":"")+' animate">';
    h += '<div class="rk-row">';
    h += '<div class="rk-left"><div class="rk-medal">'+medals[i]+'</div><div><div class="rk-name">'+v.nome+'</div><div class="rk-meta">'+v.pedidos+' pedidos · '+v.pecas+' peças · PA '+pa+' · TM R$ '+R(v.ticketMedio)+'</div></div></div>';
    h += '<div style="text-align:right"><div class="rk-fat">R$ '+R(v.faturamento)+'</div><div class="rk-pct">'+pct+'% do total</div></div>';
    h += '</div>';
    h += '<div class="rk-bar"><div class="rk-bar-fill" style="width:'+pct+'%"></div></div>';
    h += '</div>';
  });
  if(ger) h += '<div class="v-gerentes" style="margin-top:10px"><span>👔 Gerentes (Rafael + Lucas)</span><span>R$ '+R(ger.faturamento)+' · '+ger.pedidos+' ped</span></div>';
  document.getElementById("tab-ranking").innerHTML = h;
}

function buildLancar() {
  var nomes = dados&&dados.vendedores?dados.vendedores.filter(function(v){return v.nome!=="Gerentes";}).map(function(v){return v.nome;}):["Felipe","Giovana","Guilherme"];
  var chks = [["vmLoja","VM Loja"],["araras","Araras"],["vitrine","Vitrine"],["passadoria","Passadoria"],["cadastro","Cadastro"],["posVenda","Pós-venda"]];
  var h = '<div class="form-note">💡 Faturamento e pedidos vêm do Bling automaticamente. Registre aqui os dados operacionais do dia.</div>';
  h += '<div class="form-2col">';
  h += '<div><label class="f-label">Vendedor *</label><select id="fV" class="f-select"><option value="">Selecionar...</option>'+nomes.map(function(n){return '<option>'+n+'</option>';}).join("")+'</select></div>';
  h += '<div><label class="f-label">Data *</label><input type="date" id="fD" class="f-input" value="'+hoje+'"></div>';
  h += '</div>';
  h += '<div class="f-section"><div class="f-section-title">Atendimentos</div><div class="form-2col" style="margin:0">';
  h += '<div><label class="f-label">Atend. Loja</label><input type="number" id="fAL" class="f-input" placeholder="0" min="0"></div>';
  h += '<div><label class="f-label">Atend. WhatsApp</label><input type="number" id="fAW" class="f-input" placeholder="0" min="0"></div>';
  h += '</div></div>';
  h += '<div class="f-section"><div class="f-section-title">Score Operacional</div><div class="checks">';
  chks.forEach(function(c){
    h += '<div class="check '+(checks[c[0]]?"on":"")+'" id="ck-'+c[0]+'" onclick="toggleCk(\''+c[0]+'\')"><div class="check-box" id="cb-'+c[0]+'">'+(checks[c[0]]?"✓":"")+'</div><span class="check-lbl">'+c[1]+'</span></div>';
  });
  h += '</div><div class="score-line">Score: <b id="sc">'+Object.values(checks).filter(Boolean).length+'/6</b></div></div>';
  h += '<button class="btn-save" onclick="salvar()">Salvar Lançamento</button>';
  document.getElementById("tab-lancar").innerHTML = h;
}

function toggleCk(k) {
  checks[k]=!checks[k];
  var el=document.getElementById("ck-"+k), cb=document.getElementById("cb-"+k);
  if(el) el.className="check "+(checks[k]?"on":"");
  if(cb) cb.textContent=checks[k]?"✓":"";
  var sc=document.getElementById("sc");
  if(sc) sc.textContent=Object.values(checks).filter(Boolean).length+"/6";
}

function salvar() {
  var v=document.getElementById("fV").value, d=document.getElementById("fD").value;
  if(!v||!d){toast("Preencha vendedor e data!","err");return;}
  var reg={vendedor:v,data:d,atendLoja:document.getElementById("fAL").value,atendWhats:document.getElementById("fAW").value};
  Object.keys(checks).forEach(function(k){reg[k]=checks[k];});
  ops.push(reg);
  Object.keys(checks).forEach(function(k){checks[k]=false;});
  toast("✓ Lançamento de "+v+" salvo!");
  tab("dashboard"); buildDashboard();
}

function buildMetas() {
  var nomes = dados&&dados.vendedores
    ? dados.vendedores.filter(function(v){return v.nome!=="Gerentes";}).map(function(v){return v.nome;})
    : ["Felipe","Giovana","Guilherme"];
  var avatares = {"Felipe":"👨","Giovana":"👩","Guilherme":"👨‍💼"};
  var h = '<div style="font-size:11px;color:var(--text3);margin-bottom:20px;padding:12px 14px;background:var(--card);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;line-height:1.5">🎯 Defina a meta mensal de faturamento para cada vendedor. A barra de progresso aparece automaticamente no dashboard.</div>';
  nomes.forEach(function(nome) {
    var fat = 0;
    if(dados) { var vd=dados.vendedores.find(function(v){return v.nome===nome;}); if(vd) fat=vd.faturamento; }
    var meta = getMeta(nome);
    var status = metaStatus(fat, meta);
    var pct = meta>0?Math.min(100,(fat/meta*100)):0;
    h += '<div class="meta-card">';
    h += '<div class="meta-vendedor"><div class="meta-avatar">'+(avatares[nome]||"👤")+'</div><div><div class="meta-nome">'+nome+'</div><div class="meta-atual">Faturamento atual: <b style="color:var(--gold)">R$ '+R(fat)+'</b></div></div></div>';
    h += '<div class="meta-input-row"><span class="meta-prefix">R$</span><input type="number" class="meta-input" id="meta-'+nome+'" value="'+(meta||"")+'" placeholder="0,00" min="0" oninput="previewMeta(\''+nome+'\')"></div>';
    if(meta>0) {
      var resto = meta-fat;
      h += '<div class="meta-progress">';
      h += '<div class="meta-progress-top"><div class="meta-pct '+(status||"warn")+'">'+pct.toFixed(0)+'%</div><div class="meta-resto">'+(resto>0?'Faltam R$ '+R(resto):'Meta atingida! 🎉')+'</div></div>';
      h += '<div class="meta-bar"><div class="meta-bar-fill '+(status||"warn")+'" id="mbar-'+nome+'" style="width:'+pct.toFixed(1)+'%"></div></div>';
      h += '</div>';
    } else {
      h += '<div id="meta-preview-'+nome+'" style="margin-top:10px"></div>';
    }
    h += '</div>';
  });
  h += '<button class="btn-save-metas" onclick="salvarMetas()">Salvar Metas</button>';
  document.getElementById("tab-metas").innerHTML = h;
}

function previewMeta(nome) {
  var input = document.getElementById("meta-"+nome);
  var meta = Number(input.value) || 0;
  var fat = 0;
  if(dados) { var vd=dados.vendedores.find(function(v){return v.nome===nome;}); if(vd) fat=vd.faturamento; }
  var prev = document.getElementById("meta-preview-"+nome);
  if(!prev || meta===0) return;
  var pct = Math.min(100,(fat/meta*100));
  var status = metaStatus(fat,meta);
  var resto = meta-fat;
  prev.innerHTML = '<div class="meta-progress"><div class="meta-progress-top"><div class="meta-pct '+(status||"warn")+'">'+pct.toFixed(0)+'%</div><div class="meta-resto">'+(resto>0?'Faltam R$ '+R(resto):'Meta atingida! 🎉')+'</div></div><div class="meta-bar"><div class="meta-bar-fill '+(status||"warn")+'" style="width:'+pct.toFixed(1)+'%"></div></div></div>';
}

function salvarMetas() {
  var nomes = dados&&dados.vendedores
    ? dados.vendedores.filter(function(v){return v.nome!=="Gerentes";}).map(function(v){return v.nome;})
    : ["Felipe","Giovana","Guilherme"];
  nomes.forEach(function(nome){
    var input = document.getElementById("meta-"+nome);
    if(input) metas[nome] = Number(input.value) || 0;
  });
  try { localStorage.setItem("metas_fat", JSON.stringify(metas)); } catch(e){}
  toast("✓ Metas salvas!");
  buildMetas();
  if(abaAtual==="dashboard") buildDashboard();
}

// Auto-refresh 15min
var proxAtt = Date.now()+15*60*1000;
setInterval(function(){ buscarDados(); proxAtt=Date.now()+15*60*1000; }, 15*60*1000);
setInterval(function(){
  var s=Math.round((proxAtt-Date.now())/1000);
  if(s<0)return;
  var m=Math.floor(s/60), ss=s%60;
  var el=document.getElementById("countdown");
  if(el) el.textContent=m+":"+(ss<10?"0":"")+ss;
}, 1000);

buscarDados();
</script>
</body>
</html>
