    h += '</div>';
    h += '<div class="part-bar-wrap"><div class="part-bar-top"><span>Participação</span><span>'+pct2+'%</span></div><div class="part-bar"><div class="part-bar-fill" style="width:'+pct2+'%"></div></div></div>';
    h += '</div>';
  }
  h += '</div></div>';

  document.getElementById("tab-dashboard").innerHTML = h;

  mkChart("cFat", {
    type:"bar",
    data:{ labels:labels, datasets:[{ data:vends.map(function(v){ return Math.round(v.faturamento); }), backgroundColor:cores, borderRadius:6, borderSkipped:false }] },
    options:Object.assign({},CO_BASE,{ scales:{ x:CO_BASE.scales.x, y:eixoReais() } })
  });
  mkChart("cPed", {
    type:"bar",
    data:{ labels:labels, datasets:[
      { label:"Pedidos", data:vends.map(function(v){ return v.pedidos; }), backgroundColor:cores, borderRadius:4, borderSkipped:false },
      { label:"Peças", data:vends.map(function(v){ return v.pecas; }), backgroundColor:cores.map(function(c){ return c+"55"; }), borderRadius:4, borderSkipped:false }
    ]},
    options:Object.assign({},CO_BASE,{ plugins:{ legend:{ display:true, labels:{ color:"#8b8a94", font:{size:11}, boxWidth:10, boxHeight:10 } } } })
  });
}

function vds_rank(nome, vends){
  var i = vends.findIndex(function(v){ return v.nome===nome; });
  return i===0?"1º":i===1?"2º":i===2?"3º":(i+1)+"º";
}
function selV(nome){ selVendedor=nome; buildDashboard(); }

/* ══ ABA: 📅 HOJE ══════════════════════════════════════════════════ */
function buildHoje(){
  var el = document.getElementById("tab-hoje");
  if(!dadosHoje){ el.innerHTML = esqueleto("Buscando as vendas de hoje no Bling...","Isso costuma levar poucos segundos"); return; }

  var d = new Date();
  var lojas = lojasAtivas();
  var semMeta = metaLoja(lojaSel)===0;
  var fracD = fracHoje();
  var realizada = serieRealizada(lojaSel);

  var h = "";
  h += '<div class="hoje-head">';
  h += '<div><div class="hoje-data">'+fmtLongo(hoje)+' · <span>'+pad2(d.getHours())+":"+pad2(d.getMinutes())+'</span></div>';
  h += '<div class="hoje-sub">'+nomeLoja(lojaSel)+' · '+(Math.round(fracD*100))+'% do dia de loja decorrido ('+HORA_ABRE+'h–'+HORA_FECHA+'h)</div></div>';
  h += '</div>';

  if(!hist && !histErro) h += '<div class="info-note">⏳ Ainda aprendendo a distribuição por dia da semana com o Bling. Até terminar, a meta do dia é dividida igualmente entre os dias abertos.</div>';
  else if(histErro) h += '<div class="info-note">⚠️ Histórico indisponível ('+histErro+'). Metas do dia divididas igualmente entre os dias abertos.</div>';
  if(semMeta) h += '<div class="info-note">🎯 Nenhuma meta definida para <b>'+nomeLoja(lojaSel)+'</b> ainda. Vá em <b>🎯 Metas</b> para definir a meta mensal de cada vendedor — o resto é calculado automaticamente.</div>';

  // ── Cards por vendedor × loja ──
  var alertas = [];
  var totalRealHoje = 0, totalMetaHoje = 0;
  var cards = "";

  lojas.forEach(function(lojaId){
    var fechada = !abreEm(lojaId, hoje);
    NOMES_V.forEach(function(nome){
      var meta = metaV(nome, lojaId);
      var real = fatV(dadosHoje, nome, lojaId);
      var metaDia = metaDiaV(nome, lojaId, hoje);
      if(fechada && real===0 && metaDia===0) return;   // loja fechada, nada a mostrar
      if(meta===0 && real===0) return;                  // sem meta e sem venda
      totalRealHoje += real; totalMetaHoje += metaDia;

      var pct = metaDia>0 ? real/metaDia*100 : (real>0?100:0);
      var st = metaDia>0 ? statusPct(pct) : "neutro";
      var cor = st==="ok" ? "var(--cyan)" : st==="warn" ? "var(--gold)" : st==="danger" ? "var(--red)" : "var(--text3)";
      var falta = metaDia - real;

      cards += '<div class="hj-card '+st+'">';
      cards += '<div class="ring" style="--ring-p:'+Math.min(100,Math.max(0,pct)).toFixed(0)+';--ring-c:'+cor+'"><div class="ring-txt" style="color:'+cor+'">'+(metaDia>0?Math.round(pct)+"%":"—")+'</div></div>';
      cards += '<div class="hj-body">';
      cards += '<div class="hj-nome">'+avatar(nome,"sm")+' '+nome;
      if(lojaSel==="todas") cards += ' <span class="hj-loja">'+LOJAS[lojaId].emoji+' '+LOJAS[lojaId].nome+'</span>';
      cards += '</div>';
      cards += '<div class="hj-vals"><b>R$ '+R(real)+'</b>'+(metaDia>0?' de R$ '+R(metaDia):'')+' · '+pedV(dadosHoje,nome,lojaId)+' ped</div>';
      if(fechada) cards += '<div class="hj-falta">🚪 Loja fechada hoje</div>';
      else if(metaDia<=0) cards += '<div class="hj-falta">Sem meta definida</div>';
      else if(falta<=0) cards += '<div class="hj-falta ok">🎉 Meta do dia batida · +R$ '+R(-falta)+'</div>';
      else cards += '<div class="hj-falta '+st+'">Faltam R$ '+R(falta)+' para a meta de hoje</div>';
      cards += '<div class="hj-bar"><div class="hj-bar-fill '+(st==="neutro"?"warn":st)+'" style="width:'+Math.min(100,Math.max(0,pct)).toFixed(1)+'%"></div></div>';
      cards += '</div></div>';

      // ── Alertas em tempo real ──
      if(fechada || metaDia<=0) return;
      var esperadoAgora = metaDia*fracD;
      if(pct>=100){
        alertas.push({ t:"ok", ico:"🎉", txt:"<b>"+nome+"</b> já bateu a meta de hoje"+(lojaSel==="todas"?" na "+LOJAS[lojaId].nome:"")+" — R$ "+R(real)+" de R$ "+R(metaDia)+"." });
      } else if(real >= esperadoAgora){
        alertas.push({ t:"ok", ico:"✅", txt:"<b>"+nome+"</b> está no ritmo: R$ "+R(real)+" com "+Math.round(fracD*100)+"% do dia — precisa de R$ "+R(falta)+" até fechar." });
      } else if(real >= esperadoAgora*0.7){
        alertas.push({ t:"warn", ico:"⚡", txt:"<b>"+nome+"</b> está um pouco atrás do ritmo (R$ "+R(real)+" vs R$ "+R(esperadoAgora)+" esperados agora). Faltam R$ "+R(falta)+"." });
      } else {
        alertas.push({ t:"danger", ico:"🚨", txt:"<b>"+nome+"</b> está <b>R$ "+R(esperadoAgora-real)+" abaixo do ritmo</b> do dia"+(lojaSel==="todas"?" na "+LOJAS[lojaId].nome:"")+". Faltam R$ "+R(falta)+" para a meta de hoje." });
      }
    });
  });

  // ── Alerta de ritmo do mês + meta ajustada ──
  var realMes = 0, metaMesTotal = 0, esperadoMes = 0;
  NOMES_V.forEach(function(nome){
    realMes += fatV(dadosMes||dados, nome, lojaSel);
    metaMesTotal += metaV(nome, lojaSel);
    esperadoMes += metaAcumV(nome, lojaSel, hoje, fracD);
  });
  if(metaMesTotal>0 && (dadosMes||dados)){
    var difMes = realMes - esperadoMes;
    if(difMes >= 0){
      alertas.unshift({ t:"ok", ico:"📈", txt:"Mês <b>no azul</b>: R$ "+R(realMes)+" acumulados, R$ "+R(difMes)+" <b>acima</b> do ritmo necessário para bater R$ "+R(metaMesTotal)+"." });
    } else {
      var restante = fracRestanteMedia();
      var ajuste = restante>0 ? (metaMesTotal-realMes) : 0;
      alertas.unshift({ t:"danger", ico:"📉", txt:"Mês <b>atrasado</b>: R$ "+R(-difMes)+" abaixo do ritmo. Faltam R$ "+R(metaMesTotal-realMes)+" e "+diasAbertosRestantes()+" dias de loja — <b>R$ "+R(ajuste/Math.max(1,diasAbertosRestantes()))+"/dia</b> em média." });
    }
  }

  // KPIs do dia
  h += '<div class="kpi-row">';
  h += '<div class="kpi"><div class="kpi-label">💰 Vendido hoje</div><div class="kpi-num gold sm">R$ '+R(totalRealHoje)+'</div><div class="kpi-meta">'+nomeLoja(lojaSel)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🎯 Meta de hoje</div><div class="kpi-num sm">R$ '+R(totalMetaHoje)+'</div><div class="kpi-meta">'+(hist?"aprendida do Bling":"divisão simples")+'</div></div>';
  var pctDia = totalMetaHoje>0 ? totalRealHoje/totalMetaHoje*100 : 0;
  var stDia = totalMetaHoje>0 ? statusPct(pctDia) : "neutro";
  h += '<div class="kpi"><div class="kpi-label">📊 Atingimento</div><div class="kpi-num sm '+(stDia==="ok"?"cyan":stDia==="danger"?"red":"gold")+'">'+(totalMetaHoje>0?Math.round(pctDia)+"%":"—")+'</div><div class="kpi-meta">'+(totalMetaHoje>0?"esperado agora: "+Math.round(fracD*100)+"%":"defina as metas")+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">📅 Mês</div><div class="kpi-num sm">R$ '+Rk(realMes)+'</div><div class="kpi-meta">'+(metaMesTotal>0?"de R$ "+Rk(metaMesTotal)+" ("+Math.round(realMes/metaMesTotal*100)+"%)":"sem meta")+'</div></div>';
  h += '</div>';

  if(alertas.length){
    h += '<div class="sec-title">🔔 Alertas em tempo real</div>';
    h += '<div class="alertas">';
    var ordem = { danger:0, warn:1, ok:2, info:3 };
    alertas.sort(function(a,b){ return ordem[a.t]-ordem[b.t]; }).forEach(function(a){
      h += '<div class="alerta '+a.t+'"><span class="alerta-ico">'+a.ico+'</span><span>'+a.txt+'</span></div>';
    });
    h += '</div>';
  }

  h += '<div class="sec-title">👥 Progresso de hoje por vendedor</div>';
  h += cards ? '<div class="hoje-grid">'+cards+'</div>'
             : '<div class="empty">Nenhum vendedor com meta ou venda hoje em '+nomeLoja(lojaSel)+'.</div>';

  // ── Calendário do mês ──
  h += calendarioHTML(realizada);

  el.innerHTML = h;
}

// Dias de loja que ainda restam no mês (inclusive hoje)
function diasAbertosRestantes(){
  var d = new Date(), n = diasNoMes(d.getFullYear(), d.getMonth()), c = 0;
  for(var dia=d.getDate(); dia<=n; dia++){
    var s = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(dia);
    if(lojaSel==="todas"){ if(IDS_LOJAS.some(function(id){ return abreEm(id,s); })) c++; }
    else if(abreEm(lojaSel,s)) c++;
  }
  return c;
}
function fracRestanteMedia(){
  var lojas = lojasAtivas();
  return lojas.reduce(function(s,id){ return s+fracRestante(id,hoje); },0)/lojas.length;
}

function calendarioHTML(realizada){
  var d = new Date(), ano = d.getFullYear(), mes = d.getMonth();
  var n = diasNoMes(ano,mes);
  var primeiroDow = new Date(ano,mes,1).getDay();
  var temMeta = metaLoja(lojaSel)>0;

  var h = '<div class="cal-card"><div class="chart-title">🗓 '+MESES[mes]+' '+ano+' · '+nomeLoja(lojaSel)+(temMeta?' · realizado vs meta do dia':' · faturamento diário')+'</div>';
  h += '<div class="cal">';
  DIAS_C.forEach(function(x){ h += '<div class="cal-head">'+x+'</div>'; });
  for(var i=0;i<primeiroDow;i++) h += '<div class="cal-cell vazio"></div>';

  var evsAno = eventosDoAno(ano);
  for(var dia=1; dia<=n; dia++){
    var s = ano+"-"+pad2(mes+1)+"-"+pad2(dia);
    var real = realizada[s] || 0;
    var metaDia = metaDiaLoja(lojaSel, s);
    var aberta = lojaSel==="todas" ? IDS_LOJAS.some(function(id){ return abreEm(id,s); }) : abreEm(lojaSel,s);
    var futuro = s > hoje;
    var ev = evsAno.find(function(e){ return s===e.data; });

    var cls = "cal-cell";
    if(s===hoje) cls += " hoje";
    if(!aberta) cls += " fechado";
    else if(futuro) cls += " futuro";
    else if(temMeta && metaDia>0) cls += " "+statusPct(real/metaDia*100);
    else if(real>0) cls += " ok";

    var titulo = fmtDM(s)+" ("+DIAS[dow(s)]+")";
    if(!aberta) titulo += " — fechada";
    else {
      titulo += " — realizado R$ "+R(real);
      if(metaDia>0) titulo += " / meta R$ "+R(metaDia)+" ("+Math.round(real/metaDia*100)+"%)";
    }
    if(ev) titulo += " · "+ev.nome;

    h += '<div class="'+cls+'" title="'+titulo+'">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="cal-dia">'+dia+'</span>'+(ev?'<span class="cal-ev">'+ev.emoji+'</span>':'')+'</div>';
    if(!aberta) h += '<div class="cal-val">—</div>';
    else if(futuro) h += '<div class="cal-val">'+(metaDia>0?R(metaDia/1000,1)+"k":"")+'</div>';
    else h += '<div class="cal-val">'+(real>0?R(real/1000,1)+"k":"0")+'</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="cal-legend">';
  h += '<div><span class="lg-dot" style="background:rgba(6,214,160,0.5)"></span>Meta batida</div>';
  h += '<div><span class="lg-dot" style="background:rgba(240,180,41,0.5)"></span>70–99%</div>';
  h += '<div><span class="lg-dot" style="background:rgba(239,71,111,0.5)"></span>Abaixo de 70%</div>';
  h += '<div><span class="lg-dot" style="background:rgba(255,255,255,0.08);border:1px dashed var(--border2)"></span>Fechada</div>';
  h += '<div><span class="lg-dot" style="box-shadow:0 0 0 2px var(--gold);background:transparent"></span>Hoje</div>';
  h += '<div style="color:var(--text3)">Valores em milhares (k). Dias futuros mostram a meta prevista.</div>';
  h += '</div></div>';
  return h;
}

/* ══ ABA: 📊 SEMANA ════════════════════════════════════════════════ */
function buildSemana(){
  var el = document.getElementById("tab-semana");
  if(carregandoHist && !hist){ el.innerHTML = esqueleto("Aprendendo com os últimos "+mesesHist+" meses do Bling...","Na primeira vez pode levar até 2 minutos"); return; }
  if(!hist){ el.innerHTML = histErro ? erroBackendHTML("Não foi possível carregar o histórico: "+histErro) : esqueleto("Carregando histórico...",""); return; }

  var src = fonteHist(lojaSel);
  if(!src || !src.diaSemana){ el.innerHTML = '<div class="empty">Sem histórico para '+nomeLoja(lojaSel)+'.</div>'; return; }

  var abertos = src.diaSemana.filter(function(b){ return lojaSel==="todas" ? true : b.abre; });
  var comVenda = abertos.filter(function(b){ return b.dias>0; });
  var somaPeso = abertos.reduce(function(s,b){ return s+b.peso; },0) || 1;
  var melhor = comVenda.slice().sort(function(a,b){ return b.mediaDia-a.mediaDia; })[0];
  var pior = comVenda.slice().sort(function(a,b){ return a.mediaDia-b.mediaDia; })[0];

  var h = mesesSelectorHTML();
  h += '<div class="info-note">📚 Distribuição aprendida com <b>'+R(src.pedidosTotal)+' pedidos</b> em '+src.diasComVenda+' dias de venda ('+fmtDM(hist.periodo.inicio)+' a '+fmtDM(hist.periodo.fim)+'). É essa curva que divide a meta mensal entre os dias.</div>';

  h += '<div class="kpi-row">';
  h += '<div class="kpi"><div class="kpi-label">🏆 Dia mais forte</div><div class="kpi-num gold sm">'+(melhor?melhor.nome:"—")+'</div><div class="kpi-meta">'+(melhor?"R$ "+R(melhor.mediaDia)+" / dia · "+(melhor.peso/somaPeso*100).toFixed(0)+"% da semana":"")+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🥀 Dia mais fraco</div><div class="kpi-num sm">'+(pior?pior.nome:"—")+'</div><div class="kpi-meta">'+(pior?"R$ "+R(pior.mediaDia)+" / dia · "+(pior.peso/somaPeso*100).toFixed(0)+"% da semana":"")+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">📊 Média diária</div><div class="kpi-num cyan sm">R$ '+R(src.mediaDiaria)+'</div><div class="kpi-meta">dias com venda</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🎯 Ticket médio</div><div class="kpi-num sm">R$ '+R(src.ticketMedio)+'</div><div class="kpi-meta">no período</div></div>';
  h += '</div>';

  h += '<div class="chart-card"><div class="chart-title">Faturamento médio por dia da semana (R$)</div><div style="position:relative;height:210px"><canvas id="cSem" role="img" aria-label="Faturamento médio por dia da semana"></canvas></div></div>';

  h += '<div class="sec-title">📋 Peso de cada dia da semana <span class="hint">(% do faturamento semanal)</span></div>';
  h += '<div class="chart-card"><div class="tbl-wrap"><table class="tbl"><thead><tr>';
  ["Dia","Peso","Média/dia","Ticket médio","Pedidos","Dias","Distribuição"].forEach(function(t){ h += '<th>'+t+'</th>'; });
  h += '</tr></thead><tbody>';
  src.diaSemana.forEach(function(b){
    var fechado = lojaSel!=="todas" && !b.abre;
    var pesoRel = fechado ? 0 : b.peso/somaPeso*100;
    h += '<tr class="'+(fechado?"mudo":(melhor&&b.dia===melhor.dia?"destaque":""))+'">';
    h += '<td class="nome">'+b.nome+(fechado?' 🚪':(melhor&&b.dia===melhor.dia?' 🏆':''))+'</td>';
    h += '<td class="'+(fechado?"":"gold")+'">'+(fechado?"fechada":pesoRel.toFixed(1)+"%")+'</td>';
    h += '<td>'+(b.dias>0?"R$ "+R(b.mediaDia):"—")+'</td>';
    h += '<td>'+(b.pedidos>0?"R$ "+R(b.ticketMedio):"—")+'</td>';
    h += '<td>'+R(b.pedidos)+'</td>';
    h += '<td>'+b.dias+'</td>';
    h += '<td><div class="mini-bar"><div class="mini-bar-fill" style="width:'+Math.min(100,pesoRel/Math.max(1,(melhor?melhor.peso/somaPeso*100:1))*100).toFixed(0)+'%"></div></div></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div></div>';

  h += '<div class="sec-title">📆 Peso de cada semana do mês</div>';
  h += '<div class="chart-card"><div style="position:relative;height:180px"><canvas id="cSemMes" role="img" aria-label="Peso por semana do mês"></canvas></div></div>';
  h += '<div class="chart-card"><div class="tbl-wrap"><table class="tbl"><thead><tr>';
  ["Semana","Período","Peso","Média/dia","Pedidos"].forEach(function(t){ h += '<th>'+t+'</th>'; });
  h += '</tr></thead><tbody>';
  var maxSem = Math.max.apply(null, src.semanaMes.map(function(s){ return s.peso; })) || 1;
  src.semanaMes.forEach(function(s){
    h += '<tr class="'+(s.peso===maxSem?"destaque":"")+'"><td class="nome">'+s.semana+'ª semana'+(s.peso===maxSem?' 🏆':'')+'</td>';
    h += '<td>'+s.rotulo+'</td><td class="gold">'+(s.peso*100).toFixed(1)+'%</td>';
    h += '<td>'+(s.dias>0?"R$ "+R(s.mediaDia):"—")+'</td><td>'+R(s.pedidos)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';

  if(melhor && pior && pior.mediaDia>0){
    var razao = (melhor.mediaDia/pior.mediaDia).toFixed(1);
    h += '<div class="info-note cyan">💡 <b>'+melhor.nome+'</b> vende <b>'+razao+'x</b> mais que <b>'+pior.nome+'</b> em média. Escala cheia e foco de ação no '+melhor.nome.toLowerCase()+' rendem mais que esforço extra no '+pior.nome.toLowerCase()+'.</div>';
  }

  el.innerHTML = h;

  var labels = src.diaSemana.map(function(b){ return DIAS_C[b.dia]; });
  var vals = src.diaSemana.map(function(b){ return (lojaSel!=="todas" && !b.abre) ? 0 : Math.round(b.mediaDia); });
  var cores = src.diaSemana.map(function(b){
    if(lojaSel!=="todas" && !b.abre) return "rgba(255,255,255,0.06)";
    return (melhor && b.dia===melhor.dia) ? "#f0b429" : "rgba(240,180,41,0.35)";
  });
  mkChart("cSem", {
    type:"bar",
    data:{ labels:labels, datasets:[{ data:vals, backgroundColor:cores, borderRadius:6, borderSkipped:false }] },
    options:Object.assign({},CO_BASE,{ scales:{ x:CO_BASE.scales.x, y:eixoReais() } })
  });
  mkChart("cSemMes", {
    type:"bar",
    data:{ labels:src.semanaMes.map(function(s){ return s.semana+"ª"; }),
           datasets:[{ data:src.semanaMes.map(function(s){ return +(s.peso*100).toFixed(1); }), backgroundColor:"#06d6a0", borderRadius:6, borderSkipped:false }] },
    options:Object.assign({},CO_BASE,{ scales:{ x:CO_BASE.scales.x, y:{ ticks:{color:"#55545c",font:{size:10},callback:function(v){ return v+"%"; }}, grid:{color:"rgba(255,255,255,0.05)"} } } })
  });
}

function mesesSelectorHTML(){
  return '<div class="pill-group">'+[6,12,18].map(function(m){
    return '<button class="pill'+(m===mesesHist?" active":"")+'" onclick="setMesesHist('+m+')">'+m+' meses</button>';
  }).join("")+'<span style="font-size:10.5px;color:var(--text3);align-self:center;margin-left:4px">janela de aprendizado</span></div>';
}
function setMesesHist(m){
  if(m===mesesHist) return;
  mesesHist = m; hist = null; invalidarDist();
  render(abaAtual);
  garantirHist(true);
}

/* ══ ABA: 📈 MÊS ═══════════════════════════════════════════════════ */
function buildMes(){
  var el = document.getElementById("tab-mes");
  var base = dadosMes || dados;
  if(!base){ el.innerHTML = esqueleto("Carregando vendas do mês...",""); return; }

  var d = new Date(), ano = d.getFullYear(), mes = d.getMonth();
  var n = diasNoMes(ano,mes);
  var fracD = fracHoje();
  var lojas = lojasAtivas();

  // fração média do mês já decorrida (ponderada pelas lojas ativas)
  var fracDec = lojas.reduce(function(s,id){ return s+fracAcum(id,hoje,fracD); },0)/lojas.length;
  var diasRest = diasAbertosRestantes();

  var linhas = NOMES_V.map(function(nome){
    var meta = metaV(nome, lojaSel);
    var real = fatV(base, nome, lojaSel);
    // projeção somada por loja (cada loja tem sua própria curva de dias)
    var proj = 0;
    lojas.forEach(function(id){
      var r = fatV(base, nome, id);
      var f = fracAcum(id, hoje, fracD);
      proj += f>0 ? r/f : r;
    });
    var esperadoAgora = metaAcumV(nome, lojaSel, hoje, fracD);
    var falta = Math.max(0, meta-real);
    return {
      nome: nome, meta: meta, real: real, proj: proj,
      esperadoAgora: esperadoAgora, falta: falta,
      pct: meta>0 ? real/meta*100 : 0,
      pctProj: meta>0 ? proj/meta*100 : 0,
      porDia: diasRest>0 ? falta/diasRest : falta
    };
  }).sort(function(a,b){ return b.real-a.real; });

  var totMeta = linhas.reduce(function(s,l){ return s+l.meta; },0);
  var totReal = linhas.reduce(function(s,l){ return s+l.real; },0);
  var totProj = linhas.reduce(function(s,l){ return s+l.proj; },0);

  var h = "";
  if(!hist && !histErro) h += '<div class="info-note">⏳ Projeção usando divisão simples dos dias. Ao terminar de aprender o histórico, ela passa a considerar o peso real de cada dia da semana.</div>';
  if(totMeta===0) h += '<div class="info-note">🎯 Defina as metas de <b>'+nomeLoja(lojaSel)+'</b> na aba <b>🎯 Metas</b> para ver progresso e projeção.</div>';

  h += '<div class="kpi-row">';
  h += '<div class="kpi"><div class="kpi-label">💰 Realizado</div><div class="kpi-num gold sm">R$ '+R(totReal)+'</div><div class="kpi-meta">'+MESES[mes]+' · '+nomeLoja(lojaSel)+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">🎯 Meta do mês</div><div class="kpi-num sm">R$ '+R(totMeta)+'</div><div class="kpi-meta">'+(totMeta>0?Math.round(totReal/totMeta*100)+"% atingido":"não definida")+'</div></div>';
  var stProj = totMeta>0 ? statusPct(totProj/totMeta*100) : "neutro";
  h += '<div class="kpi"><div class="kpi-label">🔮 Projeção</div><div class="kpi-num sm '+(stProj==="ok"?"cyan":stProj==="danger"?"red":"gold")+'">R$ '+R(totProj)+'</div><div class="kpi-meta">'+(totMeta>0?Math.round(totProj/totMeta*100)+"% da meta":"no ritmo atual")+'</div></div>';
  h += '<div class="kpi"><div class="kpi-label">📅 Restam</div><div class="kpi-num sm">'+diasRest+'</div><div class="kpi-meta">dias de loja · '+Math.round(fracDec*100)+'% do mês feito</div></div>';
  h += '</div>';

  if(totMeta>0){
    var faltaTot = Math.max(0, totMeta-totReal);
    if(totProj>=totMeta){
      h += '<div class="alerta ok" style="margin-bottom:16px"><span class="alerta-ico">🚀</span><span>No ritmo atual a equipe <b>bate a meta</b> e fecha em torno de <b>R$ '+R(totProj)+'</b> (R$ '+R(totProj-totMeta)+' acima).</span></div>';
    } else {
      h += '<div class="alerta danger" style="margin-bottom:16px"><span class="alerta-ico">⚠️</span><span>No ritmo atual o mês fecha em <b>R$ '+R(totProj)+'</b> — <b>R$ '+R(totMeta-totProj)+' abaixo</b> da meta. Faltam R$ '+R(faltaTot)+' em '+diasRest+' dias de loja: <b>R$ '+R(diasRest>0?faltaTot/diasRest:faltaTot)+'/dia</b>.</span></div>';
    }
  }

  h += '<div class="sec-title">👥 Progresso por vendedor <span class="hint">· barra listrada = projeção</span></div>';
  linhas.forEach(function(l){
    var st = l.meta>0 ? statusPct(l.pct) : "neutro";
    var vered, vClass;
    if(l.meta===0){ vered="Sem meta"; vClass="neutro"; }
    else if(l.pct>=100){ vered="Meta batida"; vClass="ok"; }
    else if(l.pctProj>=100){ vered="Vai bater"; vClass="ok"; }
    else if(l.pctProj>=85){ vered="No limite"; vClass="warn"; }
    else { vered="Não bate"; vClass="danger"; }

    h += '<div class="mes-card">';
    h += '<div class="mes-top"><div><div class="mes-nome">'+avatar(l.nome,"sm")+' '+l.nome+'</div>';
    h += '<div class="mes-vals"><b>R$ '+R(l.real)+'</b>'+(l.meta>0?' de R$ '+R(l.meta):'')+' · '+pedV(base,l.nome,lojaSel)+' pedidos</div></div>';
    h += '<div><div class="mes-pct '+st+'">'+(l.meta>0?Math.round(l.pct)+"%":"—")+'</div><div class="mes-pct-l">'+(l.meta>0?"da meta":"defina a meta")+'</div></div></div>';

    if(l.meta>0){
      var wReal = Math.min(100,l.pct);
      var wProj = Math.min(100,l.pctProj);
      h += '<div class="mes-bar-wrap">';
      if(wProj>wReal) h += '<div class="mes-bar-proj" style="left:'+wReal.toFixed(1)+'%;width:'+(wProj-wReal).toFixed(1)+'%"></div>';
      h += '<div class="mes-bar-real '+st+'" style="width:'+wReal.toFixed(1)+'%"></div>';
      var marca = Math.min(100, l.meta>0 ? l.esperadoAgora/l.meta*100 : 0);
      h += '<div class="mes-marca" style="left:'+marca.toFixed(1)+'%" title="Ritmo necessário até agora"></div>';
      h += '</div>';
      h += '<div class="mes-legend"><span>R$ 0</span><span>ritmo esperado hoje: R$ '+R(l.esperadoAgora)+'</span><span>R$ '+R(l.meta)+'</span></div>';
      h += '<div class="mes-foot"><div class="mes-foot-txt">🔮 Projeção: <b>R$ '+R(l.proj)+'</b>'+
           (l.falta>0 ? ' · faltam R$ '+R(l.falta)+' → <b>R$ '+R(l.porDia)+'/dia</b> nos '+diasRest+' dias restantes'
                      : ' · meta já superada em R$ '+R(l.real-l.meta))+'</div>';
      h += '<div class="veredito '+vClass+'">'+vered+'</div></div>';
    } else {
      h += '<div class="mes-foot"><div class="mes-foot-txt">Sem meta definida para esta loja.</div><div class="veredito neutro">Sem meta</div></div>';
    }
    h += '</div>';
  });

  // Histórico mensal
  var src = fonteHist(lojaSel);
  if(src && src.meses && src.meses.length){
    h += '<div class="sec-title">📊 Últimos meses <span class="hint">· índice 1,00 = média do período</span></div>';
    h += '<div class="chart-card"><div style="position:relative;height:200px"><canvas id="cMeses" role="img" aria-label="Faturamento por mês"></canvas></div></div>';
    h += '<div class="chart-card"><div class="tbl-wrap"><table class="tbl"><thead><tr>';
    ["Mês","Faturamento","Índice","Média/dia","Pedidos","Dias"].forEach(function(t){ h += '<th>'+t+'</th>'; });
    h += '</tr></thead><tbody>';
    src.meses.slice().reverse().forEach(function(m){
      h += '<tr class="'+(m.parcial?"mudo":"")+'"><td class="nome">'+m.nome+' '+m.ano+(m.parcial?" (parcial)":"")+'</td>';
      h += '<td class="gold">R$ '+R(m.faturamento)+'</td>';
      h += '<td class="'+(m.indice&&m.indice>=1?"cyan":"")+'">'+(m.indice?m.indice.toFixed(2):"—")+'</td>';
      h += '<td>R$ '+R(m.mediaDia)+'</td><td>'+R(m.pedidos)+'</td><td>'+m.dias+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  el.innerHTML = h;

  if(src && src.meses && src.meses.length){
    var labels = src.meses.map(function(m){ return m.rotulo; });
    var vals = src.meses.map(function(m){ return Math.round(m.faturamento); });
    var cores = src.meses.map(function(m){ return m.parcial ? "rgba(240,180,41,0.35)" : "#f0b429"; });
    var ds = [{ label:"Faturado", data:vals, backgroundColor:cores, borderRadius:6, borderSkipped:false }];
    // projeção do mês corrente
    if(src.meses[src.meses.length-1].parcial && totProj>0){
      var projArr = src.meses.map(function(m,i){ return i===src.meses.length-1 ? Math.round(Math.max(0,totProj-m.faturamento)) : 0; });
      ds.push({ label:"Projeção", data:projArr, backgroundColor:"rgba(6,214,160,0.4)", borderRadius:6, borderSkipped:false });
    }
    mkChart("cMeses", {
      type:"bar",
      data:{ labels:labels, datasets:ds },
      options:Object.assign({},CO_BASE,{
        plugins:{ legend:{ display:ds.length>1, labels:{ color:"#8b8a94", font:{size:11}, boxWidth:10, boxHeight:10 } } },
        scales:{ x:Object.assign({stacked:true},CO_BASE.scales.x), y:Object.assign({stacked:true},eixoReais()) }
      })
    });
  }
}

/* ══ ABA: 🗓 SAZONALIDADE ══════════════════════════════════════════ */
function buildSazonalidade(){
  var el = document.getElementById("tab-sazonalidade");
  if(carregandoHist && !hist){ el.innerHTML = esqueleto("Procurando padrões sazonais nos últimos "+mesesHist+" meses...","Na primeira vez pode levar até 2 minutos"); return; }
  if(!hist){ el.innerHTML = histErro ? erroBackendHTML("Não foi possível carregar o histórico: "+histErro) : esqueleto("Carregando histórico...",""); return; }

  var src = fonteHist(lojaSel);
  if(!src){ el.innerHTML = '<div class="empty">Sem histórico para '+nomeLoja(lojaSel)+'.</div>'; return; }

  var h = mesesSelectorHTML();
  var medidos = (src.sazonalidade||[]).filter(function(e){ return e.comHistorico; });
  h += '<div class="info-note">🗓 '+(medidos.length
        ? 'Encontramos impacto histórico medido em <b>'+medidos.length+' data(s) comemorativa(s)</b> dentro da janela de '+mesesHist+' meses. Esse impacto é aplicado automaticamente na meta diária dos dias próximos a cada data.'
        : 'Nenhuma data comemorativa com histórico suficiente na janela de '+mesesHist+' meses. Amplie para <b>12 ou 18 meses</b> acima para capturar Natal, Black Friday, Dia das Mães e Dia dos Pais.')+'</div>';

  // ── Próximas datas (12 meses à frente) ──
  var ano = new Date().getFullYear();
  var proximas = eventosDoAno(ano).concat(eventosDoAno(ano+1))
    .filter(function(e){ return e.data >= hoje; })
    .sort(function(a,b){ return a.data<b.data?-1:1; })
    .slice(0,8);

  h += '<div class="sec-title">⏭ Próximas datas <span class="hint">· impacto histórico já aplicado nas metas diárias</span></div>';
  h += '<div class="saz-grid">';
  proximas.forEach(function(ev,i){
    var mult = multAprendido(ev.nome, lojaSel);
    var dias = Math.round((dt(ev.data)-dt(hoje))/86400000);
    var impPct = mult ? (mult-1)*100 : null;
    var cls = impPct==null ? "neutro" : impPct>=25 ? "ok" : impPct>=0 ? "warn" : "danger";
    h += '<div class="saz-card'+(i===0?" proxima":"")+'">';
    h += '<div class="saz-top"><div class="saz-emoji">'+ev.emoji+'</div>';
    h += '<div><div class="saz-nome">'+ev.nome+'</div><div class="saz-data">'+fmtLongo(ev.data)+'</div></div>';
    h += '<div class="saz-conta"><div class="saz-conta-n">'+(dias===0?"hoje":dias)+'</div><div class="saz-conta-l">'+(dias===0?"é hoje":dias===1?"dia":"dias")+'</div></div></div>';
    h += '<div class="saz-imp"><div class="saz-imp-n '+cls+'">'+(impPct==null?"—":(impPct>0?"+":"")+impPct.toFixed(0)+"%")+'</div><div class="saz-imp-l">'+(impPct==null?"sem histórico medido":"vs. um dia normal, na janela de "+ev.diasJanela+" dias")+'</div></div>';
    var metaJanela = 0;
    for(var k=0;k<ev.diasJanela;k++){
      var s = ymd(addD(dt(ev.janelaInicio),k));
      metaJanela += metaDiaLoja(lojaSel, s);
    }
    h += '<div class="saz-obs">Janela: '+fmtDM(ev.janelaInicio)+' → '+fmtDM(ev.janelaFim)+
         (metaJanela>0 ? ' · meta prevista na janela: <b>R$ '+R(metaJanela)+'</b>' : '')+'</div>';
    h += '</div>';
  });
  h += '</div>';

  // ── Impacto medido ──
  h += '<div class="sec-title">📐 Impacto medido no histórico</div>';
  if(!medidos.length){
    h += '<div class="empty">Nenhuma data comemorativa com pelo menos 2 dias de venda dentro da janela analisada.</div>';
  } else {
    h += '<div class="chart-card"><div class="tbl-wrap"><table class="tbl"><thead><tr>';
    ["Data","Quando","Faturado na janela","Esperado","Impacto","Dias medidos"].forEach(function(t){ h += '<th>'+t+'</th>'; });
    h += '</tr></thead><tbody>';
    medidos.slice().sort(function(a,b){ return b.impacto-a.impacto; }).forEach(function(e){
      var imp = e.impacto*100;
      h += '<tr class="'+(imp>=25?"destaque":"")+'"><td class="nome">'+e.emoji+' '+e.nome+'</td>';
      h += '<td>'+fmtDM(e.data)+'/'+String(e.ano).slice(2)+' · '+e.diaSemana+'</td>';
      h += '<td class="gold">R$ '+R(e.faturamento)+'</td><td>R$ '+R(e.esperado)+'</td>';
      h += '<td class="'+(imp>=0?"cyan":"red")+'">'+(imp>0?"+":"")+imp.toFixed(0)+'%</td>';
      h += '<td>'+e.diasMedidos+'/'+e.diasJanela+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  // ── Picos detectados automaticamente ──
  h += '<div class="sec-title">🔍 Picos detectados automaticamente <span class="hint">· dias 60%+ acima do normal daquele dia da semana</span></div>';
  if(!src.picos || !src.picos.length){
    h += '<div class="empty">Nenhum pico fora do padrão detectado no período.</div>';
  } else {
    h += '<div class="chart-card"><div class="tbl-wrap"><table class="tbl"><thead><tr>';
    ["Data","Dia","Faturado","Esperado","Acima","Pedidos","Possível causa"].forEach(function(t){ h += '<th>'+t+'</th>'; });
    h += '</tr></thead><tbody>';
    src.picos.forEach(function(p){
      h += '<tr><td class="nome">'+fmtDM(p.data)+'</td><td>'+p.diaSemana+'</td>';
      h += '<td class="gold">R$ '+R(p.faturamento)+'</td><td>R$ '+R(p.esperado)+'</td>';
      h += '<td class="cyan">'+p.razao.toFixed(1)+'x</td><td>'+p.pedidos+'</td>';
      h += '<td>'+(p.possivelCausa ? p.possivelCausa+(p.distanciaEvento?' <span style="color:var(--text3)">('+p.distanciaEvento+'d)</span>':' <span style="color:var(--text3)">(no dia)</span>') : '<span style="color:var(--text3)">não identificada</span>')+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  // ── Meses mais fortes ──
  if(src.mesesFortes && src.mesesFortes.length){
    h += '<div class="sec-title">🏅 Meses mais fortes do período</div>';
    h += '<div class="chart-card"><div style="position:relative;height:190px"><canvas id="cFortes" role="img" aria-label="Meses mais fortes"></canvas></div></div>';
  }

  el.innerHTML = h;

  if(src.mesesFortes && src.mesesFortes.length){
    mkChart("cFortes", {
      type:"bar",
      data:{ labels:src.mesesFortes.map(function(m){ return m.rotulo; }),
             datasets:[{ data:src.mesesFortes.map(function(m){ return Math.round(m.faturamento); }),
                         backgroundColor:src.mesesFortes.map(function(_,i){ return i===0?"#f0b429":"rgba(240,180,41,0.35)"; }),
                         borderRadius:6, borderSkipped:false }] },
      options:Object.assign({},CO_BASE,{ indexAxis:"y",
        scales:{ x:eixoReais(), y:{ ticks:{color:"#55545c",font:{size:11}}, grid:{color:"rgba(255,255,255,0.04)"} } } })
    });
  }
}

/* ══ ABA: 🏆 RANKING ═══════════════════════════════════════════════ */
function buildRanking(){
  var el = document.getElementById("tab-ranking");
  if(!dados){ el.innerHTML = '<div class="empty">Carregue os dados primeiro</div>'; return; }
  var vends = vendedoresDe(dados, lojaSel);
  var ger = gerentesDe(dados, lojaSel);
  var fatTotal = vends.reduce(function(s,v){ return s+v.faturamento; },0);
  var medals = ["🥇","🥈","🥉","🏅","🏅"];
  if(!vends.length){ el.innerHTML = '<div class="empty">Nenhuma venda em '+nomeLoja(lojaSel)+' neste período.</div>'; return; }
  var h = "";
  vends.forEach(function(v,i){
    var pct = fatTotal>0 ? (v.faturamento/fatTotal*100).toFixed(1) : 0;
    var pa = v.pedidos>0 ? (v.pecas/v.pedidos).toFixed(1) : "—";
    h += '<div class="rk-item '+(i===0?"first":"")+' animate">';
    h += '<div class="rk-row">';
    h += '<div class="rk-left"><div class="rk-medal">'+medals[i]+'</div>'+avatar(v.nome)+'<div><div class="rk-name">'+v.nome+'</div><div class="rk-meta">'+v.pedidos+' pedidos · '+v.pecas+' peças · PA '+pa+' · TM R$ '+R(v.ticketMedio)+'</div></div></div>';
    h += '<div style="text-align:right"><div class="rk-fat">R$ '+R(v.faturamento)+'</div><div class="rk-pct">'+pct+'% do total</div></div>';
    h += '</div>';
    h += '<div class="rk-bar"><div class="rk-bar-fill" style="width:'+pct+'%"></div></div>';
    h += '</div>';
  });
  if(ger) h += '<div class="v-gerentes" style="margin-top:10px"><span>👔 Gerentes</span><span>R$ '+R(ger.faturamento)+' · '+ger.pedidos+' ped</span></div>';
  el.innerHTML = h;
}

/* ══ ABA: ＋ LANÇAR ════════════════════════════════════════════════ */
function buildLancar(){
  var chks = [["vmLoja","VM Loja"],["araras","Araras"],["vitrine","Vitrine"],["passadoria","Passadoria"],["cadastro","Cadastro"],["posVenda","Pós-venda"]];
  var h = '<div class="form-note">💡 Faturamento e pedidos vêm do Bling automaticamente. Registre aqui os dados operacionais do dia.</div>';
  h += '<div class="form-2col">';
  h += '<div><label class="f-label">Vendedor *</label><select id="fV" class="f-select"><option value="">Selecionar...</option>'+NOMES_V.map(function(n){ return '<option>'+n+'</option>'; }).join("")+'</select></div>';
  h += '<div><label class="f-label">Loja *</label><select id="fL" class="f-select">'+IDS_LOJAS.map(function(id){ return '<option value="'+id+'"'+(lojaSel===id?" selected":"")+'>'+LOJAS[id].nome+'</option>'; }).join("")+'</select></div>';
  h += '</div>';
  h += '<div class="form-2col">';
  h += '<div><label class="f-label">Data *</label><input type="date" id="fD" class="f-input" value="'+hoje+'"></div>';
  h += '<div></div>';
  h += '</div>';
  h += '<div class="f-section"><div class="f-section-title">Atendimentos</div><div class="form-2col" style="margin:0">';
  h += '<div><label class="f-label">Atend. Loja</label><input type="number" id="fAL" class="f-input" placeholder="0" min="0"></div>';
  h += '<div><label class="f-label">Atend. WhatsApp</label><input type="number" id="fAW" class="f-input" placeholder="0" min="0"></div>';
  h += '</div></div>';
  h += '<div class="f-section"><div class="f-section-title">Score Operacional</div><div class="checks">';
  chks.forEach(function(c){
    h += '<div class="check '+(checks[c[0]]?"on":"")+'" id="ck-'+c[0]+'" onclick="toggleCk(\''+c[0]+'\')"><div class="check-box" id="cb-'+c[0]+'">'+(checks[c[0]]?"✓":"")+'</div><span class="check-lbl">'+c[1]+'</span></div>';
  });
  h += '</div><div class="score-line">Score: <b id="sc">'+Object.values(checks).filter(Boolean).length+'/6</b></div></div>';
  h += '<button class="btn-save" onclick="salvar()">Salvar Lançamento</button>';
  document.getElementById("tab-lancar").innerHTML = h;
}

function toggleCk(k){
  checks[k]=!checks[k];
  var el=document.getElementById("ck-"+k), cb=document.getElementById("cb-"+k);
  if(el) el.className="check "+(checks[k]?"on":"");
  if(cb) cb.textContent=checks[k]?"✓":"";
  var sc=document.getElementById("sc");
  if(sc) sc.textContent=Object.values(checks).filter(Boolean).length+"/6";
}

function salvar(){
  var v=document.getElementById("fV").value, d=document.getElementById("fD").value, l=document.getElementById("fL").value;
  if(!v||!d){ toast("Preencha vendedor e data!","err"); return; }
  var reg={ vendedor:v, data:d, loja:l, atendLoja:document.getElementById("fAL").value, atendWhats:document.getElementById("fAW").value };
  Object.keys(checks).forEach(function(k){ reg[k]=checks[k]; });
  ops.push(reg);
  Object.keys(checks).forEach(function(k){ checks[k]=false; });
  toast("✓ Lançamento de "+v+" salvo!");
  tab("dashboard");
}

/* ══ ABA: 🎯 METAS ═════════════════════════════════════════════════ */
// id do input de um nível: meta-<vendedor>-<loja>-<nivel>
function idInput(nome, lojaId, nivel){
  return "meta-" + nome.replace(/\s+/g,"_") + "-" + lojaId + "-" + nivel;
}

function buildMetas(){
  var el = document.getElementById("tab-metas");
  var base = dadosMes || dados;

  var h = '<div class="info-note">🎯 Cada vendedor tem <b>3 níveis por loja</b>: Meta, Super Meta e Meta Ouro. A <b>Meta</b> é a que o sistema distribui entre os dias do mês (pelo peso de cada dia da semana aprendido do Bling); Super e Ouro são degraus de reconhecimento em cima dela.</div>';
  if(legadoMigrado) h += '<div class="info-note cyan">ℹ️ Encontramos metas salvas em formato antigo e as trouxemos para o campo <b>Meta</b> de cada loja. Confira os valores e preencha Super Meta e Meta Ouro.</div>';
  if(!hist && !histErro) h += '<div class="info-note">⏳ Ainda aprendendo o histórico. A prévia da meta diária usa divisão simples até terminar.</div>';

  NOMES_V.forEach(function(nome){
    var fatTodas = fatV(base, nome, "todas");
    h += '<div class="meta-card">';
    h += '<div class="meta-vendedor">'+avatar(nome,"lg")+'<div><div class="meta-nome">'+nome+'</div>'+
         '<div class="meta-atual">Faturamento no mês (as duas lojas): <b style="color:var(--gold)">R$ '+R(fatTodas)+'</b></div></div></div>';

    IDS_LOJAS.forEach(function(lojaId){
      var fat = fatV(base, nome, lojaId);
      h += '<div class="mt-loja">';
      h += '<div class="mt-loja-head"><span class="mt-loja-nome">'+LOJAS[lojaId].emoji+' '+LOJAS[lojaId].nome+'</span>'+
           '<span class="mt-loja-fat">R$ '+R(fat)+' no mês</span></div>';
      h += '<div class="mt-inputs">';
      NIVEIS.forEach(function(n){
        var val = metaNivel(nome, lojaId, n.chave);
        var id = idInput(nome, lojaId, n.chave);
        h += '<div class="mt-campo"><label class="f-label" for="'+id+'">'+n.emoji+' '+n.rotulo+'</label>'+
             '<div class="mt-input-wrap"><span class="mt-prefix">R$</span>'+
             '<input type="number" class="mt-input" id="'+id+'" value="'+(val||"")+'" placeholder="0" min="0" step="100" '+
             'oninput="previewMeta(\''+nome+'\')"></div></div>';
      });
      h += '</div>';
      h += '<div id="mt-status-'+nome.replace(/\s+/g,"_")+'-'+lojaId+'">'+statusLojaHTML(nome, lojaId, fat)+'</div>';
      h += '</div>';
    });

    h += '<div id="meta-preview-'+nome.replace(/\s+/g,"_")+'">'+previewMetaHTML(nome, base)+'</div>';
    h += '<button class="btn-save-metas" onclick="salvarMetasDe(\''+nome+'\')">Salvar metas de '+nome+'</button>';
    h += '</div>';
  });

  h += '<button class="btn-save-metas" style="margin-top:6px" onclick="salvarMetas()">💾 Salvar todas as metas</button>';
  el.innerHTML = h;
}

// Linha de situação de um vendedor numa loja: nível atingido + barra
function statusLojaHTML(nome, lojaId, fat){
  var defs = niveisDefinidos(nome, lojaId);
  if(!defs.length) return '<div class="mt-vazio">Nenhum nível definido para esta loja.</div>';
  var h = "";
  if(niveisForaDeOrdem(nome, lojaId)){
    h += '<div class="mt-aviso">⚠️ Os valores não estão em ordem crescente (Meta &lt; Super Meta &lt; Meta Ouro). O nível atingido é calculado pelo maior valor já batido.</div>';
  }
  var atingido = nivelAtingido(nome, lojaId, fat);
  var proximo = defs.find(function(d){ return fat < d.valor; });
  h += '<div class="mt-status"><span class="meta-badge '+classeNivel(atingido)+'">'+rotuloNivel(atingido)+'</span>';
  if(proximo) h += '<span class="mt-falta">faltam <b>R$ '+R(proximo.valor-fat)+'</b> para '+proximo.rotulo+'</span>';
  else h += '<span class="mt-falta">todos os níveis batidos 🎉</span>';
  h += '</div>';
  h += barraNiveisHTML(nome, lojaId, fat);
  return h;
}

function diasAbertosNoMes(lojaId){
  var d = new Date(), ano=d.getFullYear(), mes=d.getMonth(), n=diasNoMes(ano,mes), c=0;
  for(var dia=1;dia<=n;dia++){
    if(abreEm(lojaId, ano+"-"+pad2(mes+1)+"-"+pad2(dia))) c++;
  }
  return c;
}

// Resumo do vendedor somando as duas lojas + como a Meta vira meta diária
function previewMetaHTML(nome, base){
  var metaTotal = metaV(nome, "todas");
  if(metaTotal <= 0) return '';
  var fatTodas = fatV(base, nome, "todas");

  var h = '<div class="mt-resumo">';
  NIVEIS.forEach(function(n){
    var val = metaNivel(nome, "todas", n.chave);
    if(val <= 0) return;
    var batido = fatTodas >= val;
    h += '<div class="mt-resumo-item'+(batido?" batido":"")+'"><div class="mt-resumo-lbl">'+n.emoji+' '+n.rotulo+' (2 lojas)</div>'+
         '<div class="mt-resumo-val">R$ '+R(val)+'</div>'+
         '<div class="mt-resumo-pct">'+Math.round(fatTodas/val*100)+'%</div></div>';
  });
  h += '</div>';

  // Como a Meta-base se traduz em dias
  var metaHojeV = 0;
  IDS_LOJAS.forEach(function(id){ metaHojeV += metaNivel(nome,id,"meta") * fracaoDiaPara(id, hoje); });
  var diasLoja = Math.max(1, Math.max(diasAbertosNoMes(IDS_LOJAS[0]), diasAbertosNoMes(IDS_LOJAS[1])));
  var mediaDia = metaTotal/diasLoja;
  var pesos = pesosDS(lojaSel==="todas" ? IDS_LOJAS[0] : lojaSel);
  var melhorD = -1, maiorP = 0, piorD = -1, menorP = Infinity;
  for(var i=0;i<7;i++){
    if(pesos.pesos[i]<=0) continue;
    if(pesos.pesos[i]>maiorP){ maiorP=pesos.pesos[i]; melhorD=i; }
    if(pesos.pesos[i]<menorP){ menorP=pesos.pesos[i]; piorD=i; }
  }
  h += '<div class="meta-dia-hint">';
  h += '📅 Meta de <b>hoje</b> ('+DIAS[dow(hoje)]+'): <b>R$ '+R(metaHojeV)+'</b> · média simples seria R$ '+R(mediaDia)+'<br>';
  if(pesos.aprendido && melhorD>=0 && piorD>=0 && melhorD!==piorD){
    h += '📈 Aprendido do Bling: <b>'+DIAS[melhorD]+'</b> puxa o mês pra cima, <b>'+DIAS[piorD]+'</b> é o mais fraco.';
  }
  h += '</div>';
  return h;
}

// fração do mês que uma data representa, para a loja
function fracaoDiaPara(lojaId, dataStr){
  var d = dt(dataStr);
  var dist = distMes(lojaId, d.getFullYear(), d.getMonth());
  return dist.porDia[dataStr] || 0;
}

// Lê os inputs de um vendedor para dentro de `metas` (sem persistir ainda)
function coletarInputs(nome){
  var mudou = false;
  IDS_LOJAS.forEach(function(lojaId){
    NIVEIS.forEach(function(n){
      var input = document.getElementById(idInput(nome, lojaId, n.chave));
      if(!input) return;
      var val = Math.max(0, Number(input.value) || 0);
      if(!metas[nome]) metas[nome] = metasVazias();
      if(metas[nome][lojaId][n.chave] !== val){ metas[nome][lojaId][n.chave] = val; mudou = true; }
    });
  });
  return mudou;
}

// Atualiza a prévia enquanto digita, sem persistir
function previewMeta(nome){
  coletarInputs(nome);
  invalidarDist();
  var base = dadosMes || dados;
  var slug = nome.replace(/\s+/g,"_");
  IDS_LOJAS.forEach(function(lojaId){
    var alvo = document.getElementById("mt-status-"+slug+"-"+lojaId);
    if(alvo) alvo.innerHTML = statusLojaHTML(nome, lojaId, fatV(base, nome, lojaId));
  });
  var prev = document.getElementById("meta-preview-"+slug);
  if(prev) prev.innerHTML = previewMetaHTML(nome, base);
}

function salvarMetasDe(nome){
  coletarInputs(nome);
  persistirMetas();
  legadoMigrado = false;
  invalidarDist();
  toast("✓ Metas de "+nome+" salvas!");
  buildMetas();
}

function salvarMetas(){
  NOMES_V.forEach(coletarInputs);
  persistirMetas();
  legadoMigrado = false;
  invalidarDist();
  toast("✓ Metas de todos os vendedores salvas!");
  buildMetas();
}

/* ══ AUTO-REFRESH + RELÓGIO ════════════════════════════════════════ */
var proxAtt = Date.now()+15*60*1000;
setInterval(function(){
  dadosHoje = null; dadosMes = null;
  buscarDados();
  proxAtt = Date.now()+15*60*1000;
}, 15*60*1000);

// Na aba Hoje, revalida as vendas do dia a cada 5 min
setInterval(function(){ if(abaAtual==="hoje") garantirHoje(true); }, 5*60*1000);

// Alertas em tempo real: recalcula o ritmo do dia a cada minuto
setInterval(function(){ if(abaAtual==="hoje" && dadosHoje) buildHoje(); }, 60*1000);

setInterval(function(){
  var ag = new Date();
  var rel = document.getElementById("relogio");
  if(rel) rel.textContent = pad2(ag.getHours())+":"+pad2(ag.getMinutes())+":"+pad2(ag.getSeconds());
  var s = Math.round((proxAtt-Date.now())/1000);
  if(s<0) return;
  var m = Math.floor(s/60), ss = s%60;
  var el = document.getElementById("countdown");
  if(el) el.textContent = m+":"+(ss<10?"0":"")+ss;
}, 1000);

document.getElementById("dataInicio").addEventListener("change", buscarDados);
document.getElementById("dataFim").addEventListener("change", buscarDados);

buscarDados();
garantirHoje();
garantirHist();
</script>
